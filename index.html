<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a37">
  <meta name="color-scheme" content="light">
  <title>AI Coach Academy — OROK Studios</title>
  <meta name="description" content="AI Coach Academy by OROK Studios — practical workplace AI learning for lending professionals.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand-rules.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="brand" id="brandTrigger" type="button" aria-label="AI Coach Academy home">
        <span class="brand-copy">
          <span class="master-brand">OROK STUDIOS</span>
          <span class="product-name">AI Coach Academy</span>
        </span>
      </button>

      <nav class="primary-nav" aria-label="Primary">
        <button class="nav-item active" data-view="modules" type="button" aria-current="page">
          <span aria-hidden="true">▣</span><span>Modules</span>
        </button>
        <button class="nav-item" data-view="toolkit" type="button">
          <span aria-hidden="true">◎</span><span>Toolkit</span>
        </button>
        <button class="nav-item" data-view="certificates" type="button">
          <span aria-hidden="true">♙</span><span>Certificates</span>
        </button>
      </nav>

      <div class="learner-chip" aria-label="Learner profile">
        <span class="learner-avatar">LM</span>
        <span class="learner-name">Leslie M.</span>
      </div>
    </header>

    <main id="appMain" class="app-main" tabindex="-1"></main>
  </div>

  <div id="devBackdrop" class="dev-backdrop hidden" role="presentation">
    <section class="dev-console" role="dialog" aria-modal="true" aria-labelledby="devTitle">
      <div class="dev-header">
        <div>
          <p class="eyebrow">Hidden QA mode</p>
          <h2 id="devTitle">Developer Console</h2>
        </div>
        <button id="closeDev" class="icon-button" type="button" aria-label="Close developer console">×</button>
      </div>
      <p class="dev-copy">These controls are intentionally hidden from the normal learner experience and affect only this browser.</p>
      <div class="dev-grid">
        <button type="button" data-dev="unlock-modules">Unlock all modules</button>
        <button type="button" data-dev="unlock-toolkits">Unlock all toolkits</button>
        <button type="button" data-dev="complete-module">Complete current module</button>
        <button type="button" data-dev="award-certificates">Award certificates</button>
        <button type="button" data-dev="simulate-progress">Simulate learner progress</button>
        <button type="button" data-dev="reset-progress">Reset progress</button>
        <button class="danger" type="button" data-dev="clear-storage">Clear local storage</button>
      </div>
      <div id="devStatus" class="dev-status" aria-live="polite">QA mode ready.</div>
    </section>
  </div>

  <script src="course-data.js"></script>
  <script src="startup-route.js"></script>
  <script src="app.js"></script>
  <script src="approved-workplace-assets.js"></script>
</body>
</html>
