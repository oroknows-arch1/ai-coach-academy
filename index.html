<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>AI Coach Academy</title><style>
:root{--bg:#0b0d10;--panel:#14181f;--panel2:#1b212a;--text:#f4f7fb;--muted:#9aa8b8;--border:#28313d;--accent:#6aa7ff;--ok:#55d58a;--warn:#f2c94c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.app{max-width:860px;margin:auto;padding:16px 16px 92px}.top{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.96);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid var(--border)}h1{font-size:1.25rem;margin:0}h2{font-size:1.12rem;margin:.2rem 0 .6rem}h3{font-size:1rem}.muted,.small{color:var(--muted)}.small{font-size:.84rem}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin:14px 0}.section-label{text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted);font-weight:700}.progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:10px}.progress>span{display:block;height:100%;background:var(--accent);width:0}.lesson-row,.tool-row{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--border)}.lesson-row:first-child,.tool-row:first-child{border-top:none}.lesson-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--border);flex:0 0 auto}.grow{flex:1}button,input,textarea,select{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;background:var(--accent);color:#07111f;font-weight:750;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{position:fixed;left:0;right:0;bottom:0;background:#0d1015;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{background:transparent;color:var(--muted);padding:8px 4px;font-size:.78rem}.nav button.active{color:var(--text);background:var(--panel2)}.hidden{display:none!important}.toolkit{white-space:pre-wrap;background:#10141a;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:.9rem}.option{padding:12px;border:1px solid var(--border);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--panel2)}.option.selected{outline:2px solid var(--accent)}textarea,input[type=search],input[type=text],select{width:100%;background:#0f1319;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:12px}textarea{min-height:120px}.workspace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:118px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.tile strong{font-size:.95rem}.chipbar{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.chip{white-space:nowrap}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:.72rem;color:var(--muted)}.locked{opacity:.55}.success{border-color:#295e3d;background:#122119}.cert{border-left:4px solid var(--accent)}.dev{border-color:#715f28;background:#201b0e}.divider{height:1px;background:var(--border);margin:14px 0}@media(min-width:680px){.workspace-grid{grid-template-columns:repeat(3,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:860px;border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style></head><body><div class="app"><header class="top"><h1>AI Coach Academy</h1><div class="small">Learn → Unlock → Use → Pin → Reuse</div></header><main><div id="learn"></div><div id="workspace" class="hidden"></div><div id="toolkits" class="hidden"></div><div id="certificates" class="hidden"></div><div id="lesson" class="hidden"></div><div id="toolDetail" class="hidden"></div></main></div><nav class="nav"><button data-view="learn" class="active" onclick="renderLearn()">Learn</button><button data-view="workspace" onclick="renderWorkspace()">Workspace</button><button data-view="toolkits" onclick="renderToolkits()">Toolkits</button><button data-view="certificates" onclick="showCertificates()">Certificates</button></nav><script>
const DATA = {"modules": [{"id": 1, "title": "AI Foundations", "subtitle": "Core AI concepts, prompting, verification and responsible use."}, {"id": 2, "title": "Microsoft 365 Copilot at Work", "subtitle": "Teams, Outlook, Word, Excel and everyday Microsoft 365 productivity."}, {"id": 3, "title": "Analysis & Decision Support", "subtitle": "Evidence analysis, comparisons, recommendations and decision briefs."}, {"id": 4, "title": "Safe & Responsible AI", "subtitle": "Privacy, policy, verification, governance, traceability and human accountability."}, {"id": 5, "title": "Automation & AI Systems", "subtitle": "Agents, automation, repeatable workflows, workflow improvement and controlled pilots."}, {"id": 6, "title": "Implementation & Capstone", "subtitle": "A practical implementation project, assessment and academy completion."}], "lessons": [{"module": 1, "lesson": 1, "title": "What AI does — and where judgement stays human", "concept": "<strong>What AI is actually doing:</strong> Think of AI as a fast reasoning assistant that works from the information and instructions you give it. It can summarise, compare, draft and explain. It can also produce confident answers that are incomplete or wrong.\n\nYour job is not to know how to code. Your job is to know when AI is helping, when it needs better context, and when its output must be checked against an approved source.<br><br><strong>How AI actually works in your workflow:</strong> At work, AI does not understand your lending environment the way an experienced person does. It generates a response from the instructions and information available to it. That means the quality of the result depends heavily on what you give it, what you ask it to do and how you review the answer.\n\nWhy this matters: if the source only shows what changed, AI should not present a cause as fact unless the evidence supports it.", "scenario": "A lending coach asks Copilot to summarise the main reasons applications are being delayed and suggest coaching priorities. The answer sounds polished, but some reasons were inferred from incomplete notes and one recommendation conflicts with current policy. Then extend the same method to how ai actually works in your workflow.", "exercise": "Rewrite the request so Copilot is more likely to give a useful, checkable answer. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "Which statement best describes safe use of AI in this scenario?", "answers": ["If Copilot sounds confident, the answer is probably accurate.", "AI can help analyse and draft, but important claims should be checked against approved sources.", "AI should not be used for lending work at all."], "correct": 1, "pairs": [[1, 1], [2, 1]]}, {"module": 1, "lesson": 2, "title": "Prompting for lending work", "concept": "<strong>Writing better prompts:</strong> AI usually gives better answers when your prompt tells it four things: the task, the context, the output you want, and any limits it must follow.\n\nA vague prompt makes Copilot guess. A stronger prompt reduces guessing and makes the result easier to review.<br><br><strong>Prompt structure for lending work:</strong> A useful workplace prompt reduces ambiguity. For lending work, use five parts: Task, Context, Source, Output, Boundary. You do not need advanced prompting techniques. You need enough structure so Copilot knows the job, the evidence and the limits.\n\nWhy this matters: a structured prompt reduces guessing and makes the answer easier to check.", "scenario": "You need Copilot to help prepare a short coaching note after reviewing recurring application-quality issues. A weak prompt is: “Write me something about application quality.” The task, audience, format and boundaries are unclear. Then extend the same method to prompt structure for lending work.", "exercise": "Write a stronger prompt using Task + Context + Output + Boundary. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "Which prompt gives Copilot the clearest instructions?", "answers": ["Tell me about lending quality.", "Write a good message for managers.", "Draft a 150-word coaching note for lending leaders summarising the three recurring issues below. Use plain language, do not add facts not in the notes, and finish with two questions leaders can use with their teams."], "correct": 2, "pairs": [[1, 2], [2, 3]]}, {"module": 1, "lesson": 3, "title": "Choosing Copilot and the right M365 context", "concept": "<strong>Working with Microsoft Copilot:</strong> Copilot is most useful when you match the AI task to the Microsoft 365 app you are already working in. Think app first, then task.<br><br><strong>Choosing the right AI tool:</strong> Choose the AI tool based on where the work already lives and what job needs doing. In Microsoft 365, this usually means staying close to the source: Teams for meetings, Outlook for email, Word for documents and Excel for structured data.\n\nWhy this matters: fewer handoffs means less copying, less lost context and an easier review process.", "scenario": "After a national lending capability meeting in Teams, you need to identify coaching themes, prepare a short follow-up and turn the discussion into clear next actions. Use Copilot where the work already lives: summarise in Teams, then draft the follow-up in Outlook. Then extend the same method to choosing the right ai tool.", "exercise": "Write one Copilot request you could use after a Teams meeting to identify useful coaching themes. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "Which approach uses Microsoft Copilot most effectively?", "answers": ["Ask for a generic national lending strategy without the meeting content.", "Use Copilot in Teams to summarise the meeting, identify themes, then use the verified output to help draft a follow-up in Outlook.", "Copy every available document into one prompt before deciding what you need."], "correct": 1, "pairs": [[1, 3], [2, 2]]}, {"module": 1, "lesson": 4, "title": "Verify before you use", "concept": "<strong>Verifying AI outputs:</strong> AI output should be treated as a draft until the important parts are checked. Verification means separating what AI generated from what approved sources actually confirm.<br><br><strong>Working with documents:</strong> When Copilot works with documents, separate extracting, comparing and drafting. First identify what each source actually says. Then compare the relevant points. Draft the communication only after the changes are clear.\n\nWhy this matters: separating these steps makes it easier to spot missed, changed or invented details.", "scenario": "Copilot reviews coaching notes and says a particular lending requirement is the main reason applications are being returned. The notes do not contain the current policy wording. Identify the factual claim, check the approved source, then keep or correct the summary. Then extend the same method to working with documents.", "exercise": "Write the verification instruction you would give Copilot before using its summary with lending leaders. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "Which AI output needs the strongest verification before it is shared?", "answers": ["A suggested heading for a coaching document.", "A summary that states a lending policy requirement as a confirmed fact.", "Alternative ways to phrase a meeting question."], "correct": 1, "pairs": [[1, 4], [2, 4]]}, {"module": 1, "lesson": 5, "title": "Safe AI from the first prompt", "concept": "<strong>AI safety and privacy in Microsoft 365:</strong> Safe workplace AI use starts with approved systems, appropriate access and the minimum information needed for the task. Customer, employee or commercially sensitive information should not be put into unapproved AI tools. Even inside an approved Microsoft 365 environment, use only what is necessary and follow your organisation’s information-handling rules.\n\nWhy this matters: using an approved tool does not remove your responsibility to handle sensitive information carefully.<br><br><strong>Using AI in coaching conversations:</strong> AI can help prepare for a coaching conversation by organising evidence, identifying themes and drafting useful questions. It should support your judgement, not replace it.", "scenario": "You want help drafting a coaching summary from examples that include customer details. The safe approach is to work only in approved systems, minimise unnecessary personal information and confirm the organisation’s handling requirements before using sensitive material. Then extend the same method to using ai in coaching conversations.", "exercise": "Rewrite the task so Copilot can help with the coaching summary while minimising unnecessary sensitive information. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "What is the safest default when information is sensitive?", "answers": ["Use any AI tool if the prompt says the information is confidential.", "Use approved systems, minimise the data shared and follow organisational policy and access controls.", "Paste everything into AI first, then remove sensitive details from the answer."], "correct": 1, "pairs": [[2, 5], [1, 5]]}, {"module": 1, "lesson": 6, "title": "Foundation workflow challenge", "concept": "<strong>Working across Microsoft 365:</strong> Microsoft 365 Copilot becomes more useful when you move work through the apps that already contain its information. The goal is not to ask AI to do everything at once. Follow the work.<br><br><strong>End-to-end lending scenario:</strong> Strong AI use is a controlled workflow: choose the source, give AI one clear job, verify the important output, carry forward only what is trusted, and keep human judgement responsible for the final coaching or business action.\n\nWhy this matters: the value of AI comes from speeding up parts of the work without losing control of evidence, policy or judgement.", "scenario": "A national capability review uses evidence from Teams, Outlook, Word and Excel. Summarise each source where it lives, carry only useful verified output forward, and combine the verified points in the final document. Then extend the same method to end-to-end lending scenario.", "exercise": "Write one Copilot prompt for bringing Microsoft 365 information together for a lending capability review. Include how you would verify the output and carry only trusted information into the next step.", "min": 45, "check": "Which approach is safest and most useful across Microsoft 365?", "answers": ["Create a final conclusion from all available files without checking sources.", "Summarise information where it lives, carry useful evidence forward, separate facts from assumptions and verify important claims.", "Copy every email, note and spreadsheet into one large prompt and accept the first answer."], "correct": 1, "pairs": [[1, 6], [2, 6]]}, {"module": 2, "lesson": 1, "title": "Teams meetings: prepare, capture and follow up", "concept": "<strong>Email, meeting and document workflows:</strong> The fastest way to get value from AI is to use it inside the workflow you already have. In Microsoft 365, that means using Copilot where the work lives instead of constantly moving information between tools.\n\nWhy this matters: when the meeting is in Teams, the email is in Outlook and the document is in Word, keeping each AI task close to its source reduces copying, missing context and review effort.<br><br><strong>Preparing and following up Teams meetings:</strong> Copilot can support meetings before, during and after the conversation. It can help organise existing information, summarise what was discussed and capture actions. The useful discipline is to separate discussion from confirmed decisions and actions.\n\nWhy this matters: meeting summaries are more useful when people can see what was discussed, what was decided and who owns the next step.<br><br><strong>Building multi-app Copilot workflows:</strong> Advanced Copilot use is not about using more features. It is about moving verified information through the Microsoft 365 apps that already support the work.\n\nWhy this matters: clear handoffs between apps reduce duplicated effort and make the source of each statement easier to trace.", "scenario": "A national lending capability meeting ends with several action items, open questions and follow-up emails. Use Copilot in Teams to summarise the meeting, verify the key actions, then use the confirmed summary to draft a short follow-up in Outlook and update the working Word document. Then extend the same method to preparing and following up teams meetings; building multi-app copilot workflows.", "exercise": "Write the three-step Copilot workflow you would use across Teams, Outlook and Word. State what you would verify before moving to the next step. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "Which workflow is most efficient and safest?", "answers": ["Move everything into one blank document first and ask Copilot to work it out.", "Use Copilot where the source lives, verify the output, then carry only trusted information into the next app.", "Use a different AI tool for every step to get more opinions."], "correct": 1, "pairs": [[3, 1], [4, 3], [8, 1]]}, {"module": 2, "lesson": 2, "title": "Outlook: threads, emails and clear actions", "concept": "<strong>Drafting effective emails in Outlook:</strong> Copilot can speed up email drafting when you give it the outcome, context and tone you need. Strong email prompts focus on the reader and the decision or action required, rather than simply asking AI to “make this sound better.”\n\nWhy this matters: clear emails reduce unnecessary follow-up and make workplace handoffs easier.<br><br><strong>Working with long email threads:</strong> Long email threads contain repeated information, changed decisions and unresolved questions. Ask Copilot to separate the latest confirmed position from historical discussion.\n\nWhy this matters: summarising a thread without distinguishing current from outdated information can create the wrong next action.", "scenario": "You need to email regional lending coaches after a quality review. The message must summarise two verified themes, link them to the review period and ask each coach to prepare one example for the next discussion. Then extend the same method to working with long email threads.", "exercise": "Write the Outlook Copilot prompt for this email. Keep it concise and make the requested action unmistakable. Include how you would verify the output and carry only trusted information into the next step.", "min": 50, "check": "Which email prompt is strongest?", "answers": ["Make this email better.", "Draft a concise email to regional lending coaches using the verified themes below. Explain the purpose, list the two themes and finish with the one action required before the next discussion.", "Write something professional about quality."], "correct": 1, "pairs": [[4, 2], [8, 2]]}, {"module": 2, "lesson": 3, "title": "Word: summarise, synthesise and draft", "concept": "<strong>Summarising large documents:</strong> Large documents are easier to work with when you ask AI to summarise them for a specific purpose. Instead of asking for “a summary”, tell Copilot what matters, what audience the summary is for and what must remain unchanged.\n\nWhy this matters: targeted summaries reduce noise and make it easier to compare the result back to the source.<br><br><strong>Creating better first drafts:</strong> AI is especially useful for producing a first draft when the source material and purpose are clear. The goal is not to accept the first answer. The goal is to get from blank page to useful draft faster.\n\nWhy this matters: a structured first draft gives you something concrete to review, correct and improve while keeping your judgement in control.<br><br><strong>Using Word for structured synthesis:</strong> Word is useful when several verified inputs need to become one coherent working document. Give Copilot an explicit structure and tell it which source material supports each section.\n\nWhy this matters: structured synthesis reduces the chance that important distinctions disappear in a polished narrative.", "scenario": "A new lending procedure update is 18 pages long. You need to prepare coaches for the changes. Ask Copilot to identify only the sections that affect frontline lending behaviour, preserve policy wording where necessary and point to the relevant section for each change. Then extend the same method to creating better first drafts; using word for structured synthesis.", "exercise": "Write a Copilot prompt that summarises the lending procedure specifically for coaches and requires source-section references. Include how you would verify the output and carry only trusted information into the next step.", "min": 50, "check": "What is the best instruction for summarising a long policy document?", "answers": ["Summarise this document.", "Summarise only the changes relevant to lending coaches, preserve policy requirements exactly, and identify the source section for each change.", "Make this shorter and easier to read."], "correct": 1, "pairs": [[3, 2], [3, 4], [8, 3]]}, {"module": 2, "lesson": 4, "title": "Excel: patterns, comparisons and questions", "concept": "<strong>Working with Excel and data:</strong> Copilot can help you explore structured data, identify patterns and draft a plain-language explanation of what the numbers show. The useful habit is to separate what the data shows from why it may be happening.\n\nWhy this matters: performance data can support better coaching questions, but AI should not invent causes that are not in the evidence.<br><br><strong>Using Excel for deeper comparison:</strong> Excel Copilot can help compare periods, teams and measures when the question is explicit. Define the comparison, the period and the metrics before asking for interpretation.\n\nWhy this matters: clear analytical questions produce more useful outputs than vague requests to “find insights.”", "scenario": "An Excel workbook shows approval turnaround, rework rates and application volumes across several lending teams. Ask Copilot to identify the largest changes, highlight unusual patterns and draft questions for further investigation without assigning causes. Then extend the same method to using excel for deeper comparison.", "exercise": "Write the Excel Copilot request you would use to identify significant changes and separate observations from possible explanations. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "Which statement is safest when Copilot analyses lending performance data?", "answers": ["A trend in the data proves the cause.", "AI can identify patterns, but possible causes should be treated as hypotheses until supported by evidence.", "If the numbers are in Excel, the AI explanation is automatically verified."], "correct": 1, "pairs": [[3, 3], [8, 4]]}, {"module": 2, "lesson": 5, "title": "Communicate across audiences and handoffs", "concept": "<strong>Turning information into clear messages:</strong> AI can help turn complex or scattered information into a message that is easier for the right audience to understand. The key is to tell Copilot who the message is for, what they need to know and what action should follow.\n\nWhy this matters: a technically correct message can still fail if the audience cannot quickly see what matters.<br><br><strong>Adapting one message for different audiences:</strong> The same verified information can be communicated differently depending on the audience. Copilot can help change the level of detail, language and format without changing the underlying facts.\n\nWhy this matters: a lending coach, senior stakeholder and frontline lender may need different versions of the same update, but the core information must stay consistent.<br><br><strong>Creating better handoffs between people:</strong> A good handoff gives the next person enough context to continue the work without having to reconstruct what happened. AI can help organise handoff notes into a consistent structure.\n\nWhy this matters: clearer handoffs reduce duplicated work, missed actions and unnecessary clarification.", "scenario": "A lending procedure update contains several changes. Coaches need a short message that explains what has changed, what has not changed and what they should pay attention to in upcoming coaching conversations. Then extend the same method to adapting one message for different audiences; creating better handoffs between people.", "exercise": "Write a Copilot prompt that turns the procedure update into a concise message for lending coaches. Include audience, purpose, source and required action. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "What should you define first when asking AI to improve workplace communication?", "answers": ["The audience and purpose of the message.", "The longest possible word count.", "A persuasive tone before reviewing the source."], "correct": 0, "pairs": [[4, 1], [4, 4], [4, 5]]}, {"module": 2, "lesson": 6, "title": "Build a repeatable M365 workflow", "concept": "<strong>Saving time with repeatable workflows:</strong> If you perform the same type of task regularly, turn the successful prompt and review steps into a repeatable workflow. The value comes from standardising the process, not from making prompts more complicated.\n\nWhy this matters: repeatable workflows reduce rework, make outputs more consistent and help teams use AI in a controlled way.<br><br><strong>Weekly lending productivity challenge:</strong> This challenge combines the skills from Module 3. The aim is to complete a realistic piece of lending work faster while keeping the workflow controlled and reviewable.\n\nWhy this matters: productivity is useful only when the quality of the work remains high.<br><br><strong>End-to-end communication challenge:</strong> This challenge combines the communication skills from Module 4. The goal is to turn verified lending information into clear communication across Microsoft 365 without changing the underlying facts.\n\nWhy this matters: AI is most useful when it helps information move cleanly from evidence to conversation to action.<br><br><strong>Consolidated principle:</strong> Use the same controlled pattern across the workflow: trusted source → clear AI task → verification → human judgement → reusable process.", "scenario": "Every Friday you prepare a short lending capability update from Teams notes, an Excel report and manager feedback. Build a reusable workflow that tells you what to collect, what Copilot should do, what must be verified and what the final output should contain. Then extend the same method to weekly lending productivity challenge; end-to-end communication challenge.", "exercise": "Create a reusable weekly Copilot workflow for the lending capability update. Include how you would verify the output and carry only trusted information into the next step.", "min": 60, "check": "What makes an AI workflow reusable?", "answers": ["It uses the longest possible prompt.", "It has a repeatable task, known sources, clear output and defined verification steps.", "It produces the same answer every week."], "correct": 1, "pairs": [[3, 5], [3, 6], [4, 6], [8, 5], [8, 6]]}, {"module": 3, "lesson": 1, "title": "Separate facts, observations and interpretations", "concept": "<strong>Turning evidence into useful analysis:</strong> AI can help organise evidence, compare information and identify patterns, but it should not decide what the evidence means on its own. Start by separating facts, observations and interpretation.\n\nWhy this matters: structured analysis makes it easier to see where the evidence is strong, where assumptions have entered and what still needs to be checked.<br><br><strong>Working with Excel and data:</strong> Copilot can help you explore structured data, identify patterns and draft a plain-language explanation of what the numbers show. The useful habit is to separate what the data shows from why it may be happening.\n\nWhy this matters: performance data can support better coaching questions, but AI should not invent causes that are not in the evidence.", "scenario": "A lending quality review includes application outcomes, rework data and coaching notes. You need Copilot to identify recurring patterns without turning those patterns into unsupported conclusions. Then extend the same method to working with excel and data.", "exercise": "Write a Copilot prompt that asks for facts, observations and possible interpretations in separate sections. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "What should AI separate when analysing lending evidence?", "answers": ["Facts, observations and interpretations.", "Only positive and negative comments.", "All evidence into one conclusion."], "correct": 0, "pairs": [[5, 1], [3, 3]]}, {"module": 3, "lesson": 2, "title": "Compare options using consistent criteria", "concept": "<strong>Comparing options without bias:</strong> AI can help compare options when the comparison criteria are explicit. Without clear criteria, the model may favour whichever option sounds more complete or persuasive.\n\nWhy this matters: a fair comparison needs the same criteria applied to every option.<br><br><strong>Using Excel for deeper comparison:</strong> Excel Copilot can help compare periods, teams and measures when the question is explicit. Define the comparison, the period and the metrics before asking for interpretation.\n\nWhy this matters: clear analytical questions produce more useful outputs than vague requests to “find insights.”", "scenario": "Two approaches are being considered for improving lending quality: targeted coaching for high-rework teams or a broader national refresher. You want Copilot to compare both using impact, effort, evidence, risk and speed to implement. Then extend the same method to using excel for deeper comparison.", "exercise": "Write a prompt that compares the two options using the same five criteria and avoids selecting a winner unless the evidence supports it. Include how you would verify the output and carry only trusted information into the next step.", "min": 60, "check": "What makes an AI comparison more reliable?", "answers": ["Letting AI choose its own criteria.", "Using the same defined criteria for every option.", "Choosing the preferred option before asking AI."], "correct": 1, "pairs": [[5, 2], [8, 4]]}, {"module": 3, "lesson": 3, "title": "Prepare evidence-based recommendations", "concept": "<strong>Using AI to prepare recommendations:</strong> AI can help turn verified evidence into a structured recommendation draft. A strong recommendation shows the evidence, the reasoning, the risks and what remains uncertain.\n\nWhy this matters: recommendation quality improves when the reasoning can be traced back to evidence.<br><br><strong>Identifying gaps before decisions:</strong> One of the most useful analytical tasks for AI is identifying what is missing. Before a decision is made, ask Copilot to show which claims are supported and which depend on incomplete information.\n\nWhy this matters: knowing what you do not know reduces the chance of acting on a polished but incomplete analysis.", "scenario": "You have verified that one lending team has a sustained rework issue concentrated in two application stages. You need a recommendation for a short targeted coaching intervention, including expected benefit, risks and what should be monitored. Then extend the same method to identifying gaps before decisions.", "exercise": "Write a Copilot prompt that drafts the recommendation using only the verified evidence and clearly lists risks and assumptions. Include how you would verify the output and carry only trusted information into the next step.", "min": 65, "check": "What should a good AI-assisted recommendation include?", "answers": ["Evidence, reasoning, risks and assumptions.", "Only the preferred action.", "A confident conclusion with no uncertainty."], "correct": 0, "pairs": [[5, 3], [5, 4]]}, {"module": 3, "lesson": 4, "title": "Build a decision brief with traceable evidence", "concept": "<strong>Building an evidence-based decision brief:</strong> A decision brief should make it easy for someone else to understand the issue, evidence, options and recommendation. AI can help structure the brief, but the content should come from verified sources.\n\nWhy this matters: clear decision briefs reduce ambiguity and make review easier.<br><br><strong>Traceability and evidence trails:</strong> For important work, you should be able to trace an AI-assisted output back to the evidence that supports it. This does not mean documenting every word AI generated. It means keeping the important facts, figures and decisions connected to their sources.\n\nWhy this matters: traceability makes review, correction and handoff easier.", "scenario": "Senior stakeholders need a one-page brief on a recurring lending quality issue. The brief must show the current position, evidence, options considered, recommendation, risks and next step. Then extend the same method to traceability and evidence trails.", "exercise": "Write a Copilot prompt for the one-page decision brief and specify the required headings. Include how you would verify the output and carry only trusted information into the next step.", "min": 65, "check": "What is the main purpose of a decision brief?", "answers": ["To make the recommendation sound persuasive.", "To present the issue, evidence, options and reasoning clearly enough to review.", "To replace stakeholder judgement."], "correct": 1, "pairs": [[5, 5], [6, 4]]}, {"module": 3, "lesson": 5, "title": "Use AI to surface gaps, not invent answers", "concept": "<strong>Identifying gaps before decisions:</strong> One of the most useful analytical tasks for AI is identifying what is missing. Before a decision is made, ask Copilot to show which claims are supported and which depend on incomplete information.\n\nWhy this matters: knowing what you do not know reduces the chance of acting on a polished but incomplete analysis.<br><br><strong>Verifying AI outputs:</strong> AI output should be treated as a draft until the important parts are checked. Verification means separating what AI generated from what approved sources actually confirm.", "scenario": "A performance report suggests slower approval times in one region, but the report does not include staffing levels, application complexity or system outage data. You need to identify what additional evidence would help explain the change. Then extend the same method to verifying ai outputs.", "exercise": "Write a prompt that asks Copilot to identify evidence gaps and produce investigation questions before any conclusion is made. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "What is the best response to incomplete evidence?", "answers": ["Ask AI to infer the missing facts.", "Identify the gaps and decide what additional evidence is needed.", "Ignore missing information if the trend is obvious."], "correct": 1, "pairs": [[5, 4], [1, 4]]}, {"module": 3, "lesson": 6, "title": "Decision support challenge", "concept": "<strong>End-to-end decision support challenge:</strong> This challenge combines Module 5. The goal is to use AI to organise evidence and prepare a decision-ready view without allowing AI to make the decision for you.\n\nWhy this matters: good decision support improves clarity while keeping accountability with the people responsible for the outcome.<br><br><strong>End-to-end communication challenge:</strong> This challenge combines the communication skills from Module 4. The goal is to turn verified lending information into clear communication across Microsoft 365 without changing the underlying facts.\n\nWhy this matters: AI is most useful when it helps information move cleanly from evidence to conversation to action.", "scenario": "A national lending review shows higher rework in two teams, mixed customer feedback and a recent procedure change. You have Excel data, Teams notes and the updated procedure document. Prepare a decision brief that separates verified facts, possible causes, evidence gaps, options and a recommendation for further action. Then extend the same method to end-to-end communication challenge.", "exercise": "Write the full Copilot workflow. Include the source used at each stage, how you separate fact from interpretation, what gaps you identify and how you prepare the final decision brief. Include how you would verify the output and carry only trusted information into the next step.", "min": 85, "check": "Which approach best demonstrates responsible AI decision support?", "answers": ["Ask AI to decide the best action and follow it.", "Use AI to structure evidence, compare options and expose gaps, then keep the final decision human.", "Use only the most recent source and ignore conflicting information."], "correct": 1, "pairs": [[5, 6], [4, 6]]}, {"module": 4, "lesson": 1, "title": "Recognise high-risk AI outputs", "concept": "<strong>Recognising high-risk AI outputs:</strong> Not every AI output carries the same level of risk. A draft heading is low risk. A statement about policy, customer treatment, regulatory obligations or lending requirements is much higher risk and needs stronger verification.\n\nWhy this matters: the more consequential the output, the stronger the checking process should be.<br><br><strong>Verifying AI outputs:</strong> AI output should be treated as a draft until the important parts are checked. Verification means separating what AI generated from what approved sources actually confirm.", "scenario": "Copilot drafts a coaching summary that includes a statement about when a particular lending requirement must be applied. The wording sounds confident, but the source material does not contain the current policy text. Then extend the same method to verifying ai outputs.", "exercise": "Write the verification steps you would follow before allowing this statement into a coaching document. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "Which AI output needs the strongest verification?", "answers": ["A suggested document heading.", "A statement describing a lending policy requirement.", "A list of alternative meeting titles."], "correct": 1, "pairs": [[6, 1], [1, 4]]}, {"module": 4, "lesson": 2, "title": "Privacy and minimum necessary information", "concept": "<strong>Privacy and minimum necessary information:</strong> Good AI practice means using only the information required for the task. Even in approved systems, unnecessary customer, employee or commercially sensitive details should not be included just because they are available.\n\nWhy this matters: minimising information reduces exposure while still allowing AI to help with the work.<br><br><strong>AI safety and privacy in Microsoft 365:</strong> Safe workplace AI use starts with approved systems, appropriate access and the minimum information needed for the task. Customer, employee or commercially sensitive information should not be put into unapproved AI tools. Even inside an approved Microsoft 365 environment, use only what is necessary and follow your organisation’s information-handling rules.\n\nWhy this matters: using an approved tool does not remove your responsibility to handle sensitive information carefully.", "scenario": "You want Copilot to help identify coaching themes from several returned lending applications. The examples include names, contact details and account information that are not necessary for identifying the coaching pattern. Then extend the same method to ai safety and privacy in microsoft 365.", "exercise": "Rewrite the AI task so it uses only the information required to identify the coaching themes. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "What is the safest default when preparing information for an AI task?", "answers": ["Include everything so AI has maximum context.", "Use the minimum information necessary for the task and remove unnecessary sensitive details.", "Replace names only and keep all other information."], "correct": 1, "pairs": [[6, 2], [2, 5]]}, {"module": 4, "lesson": 3, "title": "Policy, approved sources and verification", "concept": "<strong>Working with policy and approved sources:</strong> When AI is used around policy, procedure or regulated work, the approved source remains the authority. AI can explain or summarise the material, but it should not become the source of truth.\n\nWhy this matters: policy can change, and an AI-generated explanation may omit conditions or introduce wording that is not approved.<br><br><strong>Working with documents:</strong> When Copilot works with documents, separate extracting, comparing and drafting. First identify what each source actually says. Then compare the relevant points. Draft the communication only after the changes are clear.\n\nWhy this matters: separating these steps makes it easier to spot missed, changed or invented details.", "scenario": "A coach asks Copilot to explain a lending procedure in simpler language for a team discussion. Before using the explanation, you need to make sure the meaning and conditions still match the current approved procedure. Then extend the same method to working with documents.", "exercise": "Write a prompt that asks Copilot to simplify the procedure while preserving its requirements and citing the relevant section. Include how you would verify the output and carry only trusted information into the next step.", "min": 60, "check": "What remains the source of truth when AI explains lending policy?", "answers": ["The AI explanation.", "The current approved policy or procedure source.", "The most recent coaching note."], "correct": 1, "pairs": [[6, 3], [2, 4]]}, {"module": 4, "lesson": 4, "title": "Traceability and evidence trails", "concept": "<strong>Traceability and evidence trails:</strong> For important work, you should be able to trace an AI-assisted output back to the evidence that supports it. This does not mean documenting every word AI generated. It means keeping the important facts, figures and decisions connected to their sources.\n\nWhy this matters: traceability makes review, correction and handoff easier.<br><br><strong>Evidence and source control:</strong> Capstone evidence must remain traceable to trusted sources. Separate source facts from AI-generated interpretation and identify any unresolved gaps.\n\nWhy this matters: a strong final output can be checked and defended.", "scenario": "You are preparing a lending capability brief using Excel data, a Word procedure update and Teams notes. Each important statement in the brief should be traceable to one of those sources. Then extend the same method to evidence and source control.", "exercise": "Write the structure you would use so each key statement in the final brief can be traced back to its source. Include how you would verify the output and carry only trusted information into the next step.", "min": 55, "check": "What does useful traceability mean in AI-assisted work?", "answers": ["Saving every AI response forever.", "Being able to connect important claims and decisions back to the evidence that supports them.", "Keeping only the final document."], "correct": 1, "pairs": [[6, 4], [12, 2]]}, {"module": 4, "lesson": 5, "title": "Human accountability and stop rules", "concept": "<strong>Keeping human accountability:</strong> AI can support analysis, drafting and preparation, but responsibility for consequential workplace decisions stays with people. Human accountability means reviewing the evidence, considering context and owning the final decision or action.\n\nWhy this matters: AI can assist judgement, but it cannot take responsibility for lending outcomes, policy interpretation or customer impact.<br><br><strong>Risk and governance assessment:</strong> Before finalising the capstone, apply the governance controls from Module 6. Classify risk, minimise information, verify consequential claims and show who owns the final decision.\n\nWhy this matters: advanced capability includes knowing where AI should stop.", "scenario": "Copilot recommends that a regional lending team receive a targeted intervention based on performance data and coaching notes. The recommendation is useful, but a person still needs to review the evidence, risks and context before deciding what happens next. Then extend the same method to risk and governance assessment.", "exercise": "Write the human review checklist you would use before acting on an AI-assisted recommendation. Include how you would verify the output and carry only trusted information into the next step.", "min": 60, "check": "Who remains accountable for the final lending or coaching decision?", "answers": ["The AI system.", "The person or team responsible for the decision.", "Whichever source document was used first."], "correct": 1, "pairs": [[6, 5], [12, 4]]}, {"module": 4, "lesson": 6, "title": "Governance challenge", "concept": "<strong>End-to-end governance challenge:</strong> This challenge combines Module 6. The goal is to use AI productively while applying stronger controls where accuracy, privacy, policy and accountability matter most.\n\nWhy this matters: responsible AI use is not about slowing work down. It is about applying the right controls to the right level of risk.<br><br><strong>Risk and governance assessment:</strong> Before finalising the capstone, apply the governance controls from Module 6. Classify risk, minimise information, verify consequential claims and show who owns the final decision.\n\nWhy this matters: advanced capability includes knowing where AI should stop.", "scenario": "You are preparing a national lending capability brief from Excel performance data, Teams coaching notes and a Word procedure update. The brief contains figures, possible causes, a policy reference and a recommended action. Build a workflow that protects sensitive information, verifies high-risk claims, keeps a traceable evidence trail and makes the final decision clearly human-owned. Then extend the same method to risk and governance assessment.", "exercise": "Write the complete governance workflow. Include how you classify risk, minimise information, verify policy and figures, record sources and complete the final human review. Include how you would verify the output and carry only trusted information into the next step.", "min": 85, "check": "Which workflow best demonstrates responsible workplace AI governance?", "answers": ["Apply the same light review to every AI output.", "Use stronger controls for higher-risk outputs, minimise sensitive data, verify approved sources and keep final accountability human.", "Avoid AI entirely for any task involving lending."], "correct": 1, "pairs": [[6, 6], [12, 4]]}, {"module": 5, "lesson": 1, "title": "From repeatable task to AI-assisted process", "concept": "<strong>What an AI agent is:</strong> An AI agent is a system that can work through a task using instructions, available tools and defined rules rather than waiting for every individual prompt. The useful question is not “Can this be automated?” but “Which parts can be automated safely, and where must a person remain in control?”\n\nWhy this matters: agents can save time on repetitive work, but poorly defined boundaries can create faster mistakes.<br><br><strong>From prompt to process:</strong> A good prompt solves one task. A good AI system defines the full repeatable process around that task: inputs, prompt, checks, output, owner and update cycle.\n\nWhy this matters: repeatable value comes from the process, not from remembering a clever prompt.<br><br><strong>Finding the right problem:</strong> AI projects should start with a real workflow problem, not with a feature looking for somewhere to be used. Look for repeated delays, duplicated effort, manual checking or information that is difficult to assemble.\n\nWhy this matters: clear problems produce clearer success measures and smaller, safer solutions.", "scenario": "A lending capability team receives the same weekly inputs from several regions. Someone manually collects the files, checks that required fields are present and prepares a standard summary. You want to identify which steps could be handled by an agent and which still require human review. Then extend the same method to from prompt to process; finding the right problem.", "exercise": "List the steps you would allow an agent to perform, the rules it must follow and the points where a person must review or approve the work. Include how you would verify the output and carry only trusted information into the next step.", "min": 65, "check": "What is the safest starting point for an AI agent?", "answers": ["Give it broad authority and improve it later.", "Use a narrow, repeatable task with clear inputs, rules and human review points.", "Let it decide which work is important."], "correct": 1, "pairs": [[7, 1], [9, 1], [10, 1]]}, {"module": 5, "lesson": 2, "title": "Find safe automation opportunities", "concept": "<strong>Finding safe automation opportunities:</strong> The best first automation opportunities are repetitive, rules-based and low consequence. Tasks that require judgement, policy interpretation or customer-impacting decisions need stronger human involvement.\n\nWhy this matters: automating the wrong task can increase risk instead of productivity.<br><br><strong>Mapping the current workflow:</strong> Before changing a workflow, map how it operates today. Capture inputs, people, systems, decisions, delays and rework points.\n\nWhy this matters: improvement is difficult when the current process is only understood informally.", "scenario": "Your weekly workflow includes renaming files, checking whether all regional reports arrived, summarising meeting notes, interpreting lending policy and deciding which team needs intervention. Then extend the same method to mapping the current workflow.", "exercise": "Sort the workflow into automate, assist and human-only categories, and explain the boundary for each. Include how you would verify the output and carry only trusted information into the next step.", "min": 65, "check": "Which task is usually the safest to automate first?", "answers": ["A repetitive completeness check against a defined list.", "Interpreting a new lending policy requirement.", "Deciding which customer outcome is acceptable."], "correct": 0, "pairs": [[7, 2], [10, 2]]}, {"module": 5, "lesson": 3, "title": "Design the workflow, inputs and handoffs", "concept": "<strong>Designing an agent workflow:</strong> A reliable agent workflow has a clear trigger, defined inputs, limited actions, validation checks and an escalation path. Treat the workflow like a controlled process rather than a long prompt.\n\nWhy this matters: structure makes automation testable and easier to stop when something unexpected happens.<br><br><strong>Standardising inputs:</strong> AI workflows become more reliable when the expected inputs are consistent. Standardisation can include file names, required fields, reporting periods and source locations.\n\nWhy this matters: inconsistent inputs force AI and people to guess how to interpret the task.<br><br><strong>Designing the improved workflow:</strong> The improved workflow should remove unnecessary work while preserving the controls that matter. AI may automate some steps, assist others and leave some unchanged.\n\nWhy this matters: transformation is not the same as maximum automation.", "scenario": "Each Monday, regional lending reports arrive in a shared Microsoft 365 location. An agent could check that all reports are present, flag missing submissions and prepare a standard summary for review. Then extend the same method to standardising inputs; designing the improved workflow.", "exercise": "Design the workflow using Trigger → Inputs → Actions → Checks → Escalation → Human approval. Include how you would verify the output and carry only trusted information into the next step.", "min": 70, "check": "What should happen when an agent encounters missing or unexpected information?", "answers": ["Invent the missing information so the workflow can continue.", "Follow a defined escalation or stop rule.", "Ignore it unless the final output looks wrong."], "correct": 1, "pairs": [[7, 3], [9, 2], [10, 3]]}, {"module": 5, "lesson": 4, "title": "Approvals, quality gates and exceptions", "concept": "<strong>Approvals and exception handling:</strong> Automation is strongest when normal cases can move quickly and exceptions are deliberately routed to people. Define approval gates before deployment, not after something goes wrong.\n\nWhy this matters: exception handling is what keeps a fast workflow controlled.<br><br><strong>Creating quality checks:</strong> Repeatable systems need repeatable quality checks. Define checks that can be applied every cycle rather than relying on whether the output “looks right.”\n\nWhy this matters: a checklist makes quality visible and transferable between users.", "scenario": "An agent prepares a weekly lending summary. If every report is complete and figures reconcile, it can prepare the draft. If a figure is missing, inconsistent or linked to a policy-sensitive issue, the workflow must stop and flag it. Then extend the same method to creating quality checks.", "exercise": "Write the approval and exception rules for this workflow. Include how you would verify the output and carry only trusted information into the next step.", "min": 65, "check": "What is an approval gate?", "answers": ["A point where a defined human review is required before the workflow can continue or be used.", "A password used by the AI agent.", "A second AI model that approves the first one."], "correct": 0, "pairs": [[7, 4], [9, 3]]}, {"module": 5, "lesson": 5, "title": "Test, measure and run a controlled pilot", "concept": "<strong>Testing before automation goes live:</strong> Before an automated workflow is trusted, test normal cases, missing data, incorrect data and unusual cases. The goal is to learn how the system fails before it is relied on.\n\nWhy this matters: a workflow that works once is not the same as a workflow that is safe to repeat.<br><br><strong>Improving without breaking the workflow:</strong> When an AI workflow works, improve it deliberately. Change one meaningful element at a time and check whether quality or time actually improves.\n\nWhy this matters: uncontrolled changes can make a reliable process harder to understand and verify.<br><br><strong>Defining success measures:</strong> An AI improvement needs measurable outcomes. Useful measures include cycle time, rework, error rate, completion rate and user effort. Do not measure success only by whether people used the AI tool.\n\nWhy this matters: adoption is not the same as value.<br><br><strong>Consolidated principle:</strong> Use the same controlled pattern across the workflow: trusted source → clear AI task → verification → human judgement → reusable process.", "scenario": "You have built a prototype that checks regional lending reports and prepares a summary. You need a test set covering complete reports, missing reports, duplicate reports, inconsistent totals and an unexpected file format. Then extend the same method to improving without breaking the workflow; defining success measures.", "exercise": "Create a five-case test plan and state the expected behaviour for each case. Include how you would verify the output and carry only trusted information into the next step.", "min": 70, "check": "What should testing include before an automation is trusted?", "answers": ["Only the normal successful path.", "Normal, missing, incorrect and unusual cases.", "Only examples generated by the AI system."], "correct": 1, "pairs": [[7, 5], [9, 5], [10, 4], [10, 5]]}, {"module": 5, "lesson": 6, "title": "Build a documented reusable AI system", "concept": "<strong>End-to-end agent challenge:</strong> This challenge combines Module 7. The goal is to design a useful agent workflow without giving automation more authority than the task requires.\n\nWhy this matters: safe automation is specific, testable and easy to interrupt.<br><br><strong>Documenting the system:</strong> A workplace AI system should be understandable by someone other than its creator. Document what it does, what it uses, what can go wrong and how to review it.\n\nWhy this matters: documented systems are easier to hand over, audit and improve.<br><br><strong>System-building challenge:</strong> This challenge combines Module 9. The goal is to turn a useful AI workflow into a repeatable workplace system that another person could run confidently.\n\nWhy this matters: scalable AI use depends on clear systems, not individual memory.<br><br><strong>Consolidated principle:</strong> Use the same controlled pattern across the workflow: trusted source → clear AI task → verification → human judgement → reusable process.", "scenario": "Design an agent-assisted weekly lending capability workflow that checks report completeness, creates a draft summary, flags anomalies and prepares the result for a human reviewer. It must never interpret policy or make a coaching decision on its own. Then extend the same method to documenting the system; system-building challenge.", "exercise": "Write the complete workflow including trigger, inputs, actions, validation checks, exception handling, approval gate and test cases. Include how you would verify the output and carry only trusted information into the next step.", "min": 85, "check": "Which design is strongest?", "answers": ["An agent that completes the full workflow including final decisions.", "A narrow agent that performs defined repetitive steps, stops on exceptions and requires human approval before use.", "A general agent with access to every available file."], "correct": 1, "pairs": [[7, 6], [9, 4], [9, 6], [10, 6]]}, {"module": 6, "lesson": 1, "title": "Choose a practical implementation problem", "concept": "<strong>Choose the project:</strong> Your implementation project should solve one bounded workplace problem that is important enough to matter and small enough to test. Avoid starting with an organisation-wide transformation.\n\nWhy this matters: narrow projects create faster evidence and clearer learning.<br><br><strong>Capstone brief:</strong> The capstone combines the academy into one practical lending scenario. You are expected to choose the right AI tasks, use Microsoft 365 appropriately, verify important evidence and keep human accountability clear.\n\nWhy this matters: completion should demonstrate usable workplace capability, not memory of terminology.", "scenario": "Choose one lending capability workflow such as weekly reporting, meeting follow-up, procedure-change communication, document comparison or quality analysis. Then extend the same method to capstone brief.", "exercise": "Define your project in one paragraph: problem, user, current friction, desired outcome and what is explicitly out of scope. Include how you would verify the output and carry only trusted information into the next step.", "min": 80, "check": "What is the best first implementation project?", "answers": ["A narrow workflow with clear evidence and boundaries.", "A full redesign of every lending process.", "Whatever uses the most AI features."], "correct": 0, "pairs": [[11, 1], [12, 1]]}, {"module": 6, "lesson": 2, "title": "Define trusted evidence, requirements and risk", "concept": "<strong>Define evidence and requirements:</strong> Before designing the AI solution, define what sources are trusted, what information is required and which constraints cannot be compromised.\n\nWhy this matters: requirements protect the project from drifting into assumptions.<br><br><strong>Evidence and source control:</strong> Capstone evidence must remain traceable to trusted sources. Separate source facts from AI-generated interpretation and identify any unresolved gaps.\n\nWhy this matters: a strong final output can be checked and defended.", "scenario": "Your project depends on Excel performance data, Teams notes and an approved Word procedure. Some outputs could influence coaching priorities. Then extend the same method to evidence and source control.", "exercise": "Define the trusted sources, required inputs, privacy requirements, verification needs and human decisions for your project. Include how you would verify the output and carry only trusted information into the next step.", "min": 80, "check": "What should be defined before the solution?", "answers": ["Trusted sources and non-negotiable requirements.", "A logo for the project.", "The final prompt wording only."], "correct": 0, "pairs": [[11, 2], [12, 2]]}, {"module": 6, "lesson": 3, "title": "Design the end-to-end workflow", "concept": "<strong>Design the workflow:</strong> Turn the project into a step-by-step workflow. Use AI only where it has a clear job and show where checks, exceptions and approvals occur.\n\nWhy this matters: a workflow is easier to test than a general idea.<br><br><strong>Analysis and communication:</strong> A complete workplace outcome usually requires both analysis and communication. Keep the evidence stable while adapting the output to the needs of different audiences.\n\nWhy this matters: good AI work is useful only when the right people can understand and act on it.", "scenario": "Design the sequence from source collection through AI assistance to final approved output. Then extend the same method to analysis and communication.", "exercise": "Write the project workflow using Trigger → Inputs → AI Task → Validation → Human Review → Output → Storage. Include how you would verify the output and carry only trusted information into the next step.", "min": 85, "check": "What should every AI step have?", "answers": ["A clear purpose and defined boundary.", "Freedom to use any available source.", "A different model."], "correct": 0, "pairs": [[11, 3], [12, 3]]}, {"module": 6, "lesson": 4, "title": "Create test cases and governance checks", "concept": "<strong>Create the test plan:</strong> A project is not ready because the normal example worked. Define test cases, expected results and pass criteria before the pilot.\n\nWhy this matters: testing exposes failure modes before they become workplace problems.<br><br><strong>Risk and governance assessment:</strong> Before finalising the capstone, apply the governance controls from Module 6. Classify risk, minimise information, verify consequential claims and show who owns the final decision.\n\nWhy this matters: advanced capability includes knowing where AI should stop.", "scenario": "Your workflow must handle normal data, missing inputs, conflicting information and a policy-sensitive case. Then extend the same method to risk and governance assessment.", "exercise": "Create at least four test cases with expected behaviour and pass criteria. Include how you would verify the output and carry only trusted information into the next step.", "min": 80, "check": "What should a project test plan contain?", "answers": ["Normal and failure cases with expected behaviour.", "Only the best example.", "A list of future features."], "correct": 0, "pairs": [[11, 4], [12, 4]]}, {"module": 6, "lesson": 5, "title": "Plan the pilot, measures and operating guide", "concept": "<strong>Plan the pilot and measurement:</strong> The pilot should test whether the project creates value without weakening quality or control. Define baseline, target, participants, duration and review criteria.\n\nWhy this matters: the project becomes credible when its results can be measured.<br><br><strong>Build the reusable system:</strong> The final capstone step is to turn the successful workflow into something reusable. Document the inputs, prompts, checks, outputs and ownership so the process can be repeated.\n\nWhy this matters: sustainable AI capability is a system, not a one-off result.", "scenario": "You will test the workflow with a small group for four weeks before any wider rollout. Then extend the same method to build the reusable system.", "exercise": "Write your pilot plan and define at least one productivity measure and one quality guardrail. Include how you would verify the output and carry only trusted information into the next step.", "min": 80, "check": "What should a pilot compare against?", "answers": ["A baseline from the current workflow.", "Only user enthusiasm.", "The newest version of the AI tool."], "correct": 0, "pairs": [[11, 5], [12, 5]]}, {"module": 6, "lesson": 6, "title": "Final assessment and academy completion", "concept": "<strong>Implementation project submission:</strong> This challenge brings the project together into one implementation-ready brief. The goal is not to build software; it is to prove that you can define and control an AI-enabled workplace workflow.\n\nWhy this matters: implementation skill is the ability to turn AI capability into a clear, testable process.<br><br><strong>Final academy assessment:</strong> This final assessment checks the complete working method taught across AI Coach Academy: define the task, use the right source and tool, verify important output, manage risk, keep judgement human and make successful work reusable.\n\nWhy this matters: the goal of the academy is confident, controlled workplace use of AI.", "scenario": "Prepare the final project brief for your chosen lending workflow. Then extend the same method to final academy assessment.", "exercise": "Combine your project problem, evidence, requirements, workflow, controls, test plan, pilot and measures into one concise implementation brief. Include how you would verify the output and carry only trusted information into the next step.", "min": 85, "check": "When is an AI implementation proposal ready for a pilot?", "answers": ["When the workflow, controls, testing and measures are defined well enough to review.", "As soon as the idea sounds useful.", "When AI can complete the task without people."], "correct": 0, "pairs": [[11, 6], [12, 6]]}], "toolkits": [{"id": "m1l1", "title": "What AI is actually doing", "category": "Verify", "text": "VERIFY BEFORE YOU USE\n\nTASK\nTell Copilot exactly what you want it to do.\n\nCONTEXT\nGive it the relevant lending or coaching context.\n\nSOURCE\nTell it what material it should rely on.\n\nBOUNDARY\nTell it not to invent missing facts.\n\nVERIFY\nIdentify what should be checked against an approved source before use.", "unlockModule": 1, "unlockLesson": 1, "for": "Think of AI as a fast reasoning assistant that works from the information and instructions you give it.", "when": "A lending coach asks Copilot to summarise the main reasons applications are being delayed and suggest coaching priorities. The answer sounds polished, but some reasons were inferred from incomplete notes and one recommendation conflicts with current policy.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m1l2", "title": "Writing better prompts", "category": "Verify", "text": "FOUR-PART PROMPT\n\nTASK\nWhat do you want Copilot to do?\n\nCONTEXT\nWhat does it need to know?\n\nOUTPUT\nWhat should the answer look like?\n\nBOUNDARY\nWhat must Copilot avoid, preserve or verify?", "unlockModule": 1, "unlockLesson": 2, "for": "AI usually gives better answers when your prompt tells it four things: the task, the context, the output you want, and any limits it must follow.", "when": "You need Copilot to help prepare a short coaching note after reviewing recurring application-quality issues. A weak prompt is: “Write me something about application quality.” The task, audience, format and boundaries are unclear.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m1l3", "title": "Working with Microsoft Copilot", "category": "Automation", "text": "APP → TASK → CHECK\n\nAPP\nWhere does the work already live?\n\nTASK\nWhat is the one thing you want AI to help with?\n\nCONTEXT\nWhat information should Copilot use?\n\nCHECK\nWhat must you review before using or sharing the result?", "unlockModule": 1, "unlockLesson": 3, "for": "Copilot is most useful when you match the AI task to the Microsoft 365 app you are already working in.", "when": "After a national lending capability meeting in Teams, you need to identify coaching themes, prepare a short follow-up and turn the discussion into clear next actions. Use Copilot where the work already lives: summarise in Teams, then draft the follow-up in Outlook.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m1l4", "title": "Verifying AI outputs", "category": "Verify", "text": "CLAIM → SOURCE → DECISION\n\nCLAIM\nWhat statement is being presented as fact?\n\nSOURCE\nWhat approved source can confirm or reject it?\n\nDECISION\nKeep it, correct it, remove it, or mark it uncertain.\n\nUSE\nShare only after important claims are verified.", "unlockModule": 4, "unlockLesson": 1, "for": "AI output should be treated as a draft until the important parts are checked.", "when": "Copilot reviews coaching notes and says a particular lending requirement is the main reason applications are being returned. The notes do not contain the current policy wording. Identify the factual claim, check the approved source, then keep or correct the summary.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m1l5", "title": "Using AI in coaching conversations", "category": "Automation", "text": "EVIDENCE → THEME → QUESTION\n\nEVIDENCE\nWhat notes, examples or feedback should Copilot use?\n\nTHEME\nIdentify repeated patterns without inventing causes.\n\nQUESTION\nSuggest open coaching questions linked to those patterns.\n\nJUDGEMENT\nReview and choose what is useful.", "unlockModule": 1, "unlockLesson": 5, "for": "AI can help prepare for a coaching conversation by organising evidence, identifying themes and drafting useful questions.", "when": "A regional lending team has repeated application-quality issues. You have coaching notes, returned application examples and leader feedback. Ask Copilot to identify repeated themes, separate evidence from assumptions and suggest open questions you can adapt.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m1l6", "title": "Working across Microsoft 365", "category": "Verify", "text": "SOURCE → TASK → CARRY → CHECK\n\nSOURCE\nWhere does the information live?\n\nTASK\nWhat is the one job Copilot should do?\n\nCARRY\nWhat verified information moves forward?\n\nCHECK\nWhich facts, figures, policy statements or customer-impacting claims must be confirmed?\n\nFINAL\nCreate final output only from verified evidence.", "unlockModule": 1, "unlockLesson": 6, "for": "Microsoft 365 Copilot becomes more useful when you move work through the apps that already contain its information.", "when": "A national capability review uses evidence from Teams, Outlook, Word and Excel. Summarise each source where it lives, carry only useful verified output forward, and combine the verified points in the final document.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l1", "title": "How AI actually works in your workflow", "category": "Verify", "text": "OBSERVE → EXPLAIN → VERIFY\n\nOBSERVE\nWhat does the source actually show?\n\nEXPLAIN\nWhat possible explanations are worth investigating?\n\nVERIFY\nWhat additional evidence would confirm or reject each explanation?", "unlockModule": 1, "unlockLesson": 1, "for": "At work, AI does not understand your lending environment the way an experienced person does.", "when": "You ask Copilot why a team’s approval turnaround has slowed. The report shows a change, but it does not contain enough evidence to explain the cause. Copilot can identify the visible pattern, but any explanation must be treated as a hypothesis until supported.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l2", "title": "Choosing the right AI tool", "category": "Verify", "text": "WORK → APP → TASK\n\nWORK\nWhat needs to be done?\n\nAPP\nWhere does the source already live?\n\nTASK\nWhat single AI job is useful here?\n\nHANDOFF\nWhat verified output should move to the next step?", "unlockModule": 1, "unlockLesson": 3, "for": "Choose the AI tool based on where the work already lives and what job needs doing.", "when": "A lending leader asks for a summary of a Teams meeting, a comparison of an Excel performance table and a follow-up email. Instead of one giant prompt, use the relevant app for each task and carry verified outputs between them.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l3", "title": "Prompt structure for lending work", "category": "Verify", "text": "FIVE-PART WORK PROMPT\n\nTASK — What should AI do?\nCONTEXT — Why is this being done and for whom?\nSOURCE — What approved material should it use?\nOUTPUT — What should the result look like?\nBOUNDARY — What must it not invent, change or assume?", "unlockModule": 1, "unlockLesson": 2, "for": "A useful workplace prompt reduces ambiguity.", "when": "You need a concise summary for regional lending leaders from an approved quality report. The summary must preserve the figures, avoid unsupported causes and end with three evidence-based questions for discussion.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l4", "title": "Working with documents", "category": "Word", "text": "EXTRACT → COMPARE → DRAFT\n\nEXTRACT\nPull the relevant facts from each source.\n\nCOMPARE\nShow the differences and where they came from.\n\nVERIFY\nConfirm the important differences.\n\nDRAFT\nCreate the communication from verified changes only.", "unlockModule": 4, "unlockLesson": 3, "for": "When Copilot works with documents, separate extracting, comparing and drafting.", "when": "You have two versions of a lending procedure document and need to explain the changes to coaches. First ask Copilot to identify differences with source references. Then review the changes. Only then draft the communication.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l5", "title": "AI safety and privacy in Microsoft 365", "category": "Privacy", "text": "SAFE AI CHECK\n\nAPPROVED\nAm I using an approved workplace AI environment?\n\nNECESSARY\nDoes AI need this information to complete the task?\n\nMINIMISE\nCan personal or sensitive detail be removed?\n\nACCESS\nShould the person using the output have access to the source?\n\nVERIFY\nDoes the final output still comply with workplace policy?", "unlockModule": 4, "unlockLesson": 2, "for": "Safe workplace AI use starts with approved systems, appropriate access and the minimum information needed for the task.", "when": "You want help drafting a coaching summary from examples that include customer details. The safe approach is to work only in approved systems, minimise unnecessary personal information and confirm the organisation’s handling requirements before using sensitive material.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m2l6", "title": "End-to-end lending scenario", "category": "Word", "text": "END-TO-END AI WORKFLOW\n\n1. SOURCE — Identify where each piece of evidence lives.\n2. TASK — Give Copilot one clear job at each stage.\n3. VERIFY — Check facts, figures, policy and customer-impacting claims.\n4. CARRY — Move only trusted information forward.\n5. SYNTHESISE — Combine verified evidence in the final working document.\n6. JUDGEMENT — Keep the final coaching or business decision human.", "unlockModule": 1, "unlockLesson": 6, "for": "Strong AI use is a controlled workflow: choose the source, give AI one clear job, verify the important output, carry forward only what is trusted, and keep human judgement responsible for the final coaching or business action.", "when": "You are preparing a national lending capability review from a Teams discussion, an Excel performance report, a Word procedure update and an Outlook feedback thread. You need a concise review that distinguishes confirmed facts, observations, possible causes and questions requiring further investigation.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l1", "title": "Email, meeting and document workflows", "category": "Outlook", "text": "WORK WHERE THE WORK LIVES\n\n1. TEAMS — Summarise the meeting and identify actions.\n2. VERIFY — Confirm owners, dates and decisions.\n3. OUTLOOK — Draft the follow-up from verified actions.\n4. WORD — Update the working document with confirmed information only.\n5. FINAL CHECK — Review before sending or sharing.", "unlockModule": 2, "unlockLesson": 1, "for": "The fastest way to get value from AI is to use it inside the workflow you already have.", "when": "A national lending capability meeting ends with several action items, open questions and follow-up emails. Use Copilot in Teams to summarise the meeting, verify the key actions, then use the confirmed summary to draft a short follow-up in Outlook and update the working Word document.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l2", "title": "Summarising large documents", "category": "Word", "text": "PURPOSED SUMMARY\n\nAUDIENCE — Who needs the summary?\nPURPOSE — What do they need to do with it?\nFOCUS — Which sections or topics matter?\nPRESERVE
