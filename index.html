— What wording, figures or requirements must not change?\nREFERENCE — Where did each key point come from?", "unlockModule": 2, "unlockLesson": 3, "for": "Large documents are easier to work with when you ask AI to summarise them for a specific purpose.", "when": "A new lending procedure update is 18 pages long. You need to prepare coaches for the changes. Ask Copilot to identify only the sections that affect frontline lending behaviour, preserve policy wording where necessary and point to the relevant section for each change.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l3", "title": "Working with Excel and data", "category": "Excel", "text": "DATA → PATTERN → QUESTION\n\nDATA\nConfirm the range, period and measures being analysed.\n\nPATTERN\nIdentify changes, outliers and recurring trends.\n\nSEPARATE\nKeep observations separate from possible explanations.\n\nQUESTION\nCreate investigation questions for the patterns that matter.\n\nVERIFY\nCheck figures before sharing conclusions.", "unlockModule": 3, "unlockLesson": 1, "for": "Copilot can help you explore structured data, identify patterns and draft a plain-language explanation of what the numbers show.", "when": "An Excel workbook shows approval turnaround, rework rates and application volumes across several lending teams. Ask Copilot to identify the largest changes, highlight unusual patterns and draft questions for further investigation without assigning causes.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l4", "title": "Creating better first drafts", "category": "Verify", "text": "FIRST DRAFT BRIEF\n\nAUDIENCE — Who is this for?\nPURPOSE — What should they understand or do?\nSOURCE — What verified inputs can AI use?\nSTRUCTURE — What sections or format do you want?\nBOUNDARY — What must not be invented or changed?\nREVIEW — What will you check before sharing?", "unlockModule": 2, "unlockLesson": 3, "for": "AI is especially useful for producing a first draft when the source material and purpose are clear.", "when": "You need a one-page lending capability update for senior stakeholders. You already have verified metrics, three coaching themes and the agreed next actions. Ask Copilot to draft the update using only those inputs and to keep unresolved points clearly marked.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l5", "title": "Saving time with repeatable workflows", "category": "Verify", "text": "REPEATABLE AI WORKFLOW\n\nTRIGGER — When does this task happen?\nINPUTS — What sources are required?\nAI TASK — What should Copilot do?\nOUTPUT — What should the result look like?\nVERIFY — What must be checked every time?\nSAVE — Keep the successful prompt and process for reuse.", "unlockModule": 2, "unlockLesson": 6, "for": "If you perform the same type of task regularly, turn the successful prompt and review steps into a repeatable workflow.", "when": "Every Friday you prepare a short lending capability update from Teams notes, an Excel report and manager feedback. Build a reusable workflow that tells you what to collect, what Copilot should do, what must be verified and what the final output should contain.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m3l6", "title": "Weekly lending productivity challenge", "category": "Verify", "text": "MODULE 3 PRODUCTIVITY PLAYBOOK\n\n1. START WITH THE WORK — Identify where each source lives.\n2. ONE TASK AT A TIME — Give Copilot a clear job in each app.\n3. VERIFY BEFORE HANDOFF — Check important facts, figures and decisions.\n4. CARRY TRUSTED OUTPUTS — Move only confirmed information forward.\n5. DRAFT THE FINAL BRIEF — Use verified evidence only.\n6. SAVE THE WORKFLOW — Reuse the process next week.", "unlockModule": 2, "unlockLesson": 6, "for": "This challenge combines the skills from Module 3.", "when": "You have a Teams meeting summary, an Excel performance report, a Word procedure update and an Outlook feedback thread. Create a short weekly lending capability brief that identifies verified facts, recurring themes, open questions and next actions. Use Copilot in the appropriate Microsoft 365 apps rather than forcing everything into one prompt.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l1", "title": "Turning information into clear messages", "category": "Word", "text": "CLEAR MESSAGE BRIEF\n\nAUDIENCE — Who is this for?\nPURPOSE — What do they need to understand?\nSOURCE — What verified information should AI use?\nMESSAGE — What are the essential points?\nACTION — What should happen next?\nCHECK — What facts or wording must be verified before sending?", "unlockModule": 2, "unlockLesson": 5, "for": "AI can help turn complex or scattered information into a message that is easier for the right audience to understand.", "when": "A lending procedure update contains several changes. Coaches need a short message that explains what has changed, what has not changed and what they should pay attention to in upcoming coaching conversations.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l2", "title": "Drafting effective emails in Outlook", "category": "Outlook", "text": "OUTLOOK EMAIL PROMPT\n\nRECIPIENT — Who is receiving it?\nPURPOSE — Why are you emailing?\nFACTS — What verified information must be included?\nACTION — What do you need from the reader?\nTONE — What tone suits the situation?\nLIMIT — What should be kept concise or excluded?", "unlockModule": 2, "unlockLesson": 2, "for": "Copilot can speed up email drafting when you give it the outcome, context and tone you need.", "when": "You need to email regional lending coaches after a quality review. The message must summarise two verified themes, link them to the review period and ask each coach to prepare one example for the next discussion.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l3", "title": "Preparing and following up Teams meetings", "category": "Meetings", "text": "TEAMS FOLLOW-UP\n\nDISCUSSION — What themes were discussed?\nDECISIONS — What was actually agreed?\nACTIONS — What needs to happen next?\nOWNER — Who owns each action?\nDATE — When is it due?\nOPEN — What remains unresolved?\nVERIFY — Confirm actions and owners before circulating.", "unlockModule": 2, "unlockLesson": 1, "for": "Copilot can support meetings before, during and after the conversation.", "when": "A Teams meeting with lending coaches covers application quality, turnaround and an upcoming procedure change. After the meeting, you need a summary that separates discussion themes, confirmed decisions, actions, owners and unresolved questions.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l4", "title": "Adapting one message for different audiences", "category": "Verify", "text": "ONE SOURCE, TWO AUDIENCES\n\nSOURCE — Start with the same verified facts.\nAUDIENCE A — What do they need to know?\nAUDIENCE B — What do they need to know?\nADAPT — Change detail, language and format.\nPRESERVE — Keep facts, figures and requirements unchanged.\nCOMPARE — Check both versions against the source.", "unlockModule": 2, "unlockLesson": 5, "for": "The same verified information can be communicated differently depending on the audience.", "when": "A lending quality review has three confirmed findings. You need one short version for senior stakeholders and another practical version for lending coaches. Both must use the same verified findings.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l5", "title": "Creating better handoffs between people", "category": "Verify", "text": "HANDOFF FORMAT\n\nCONTEXT — What is this work about?\nEVIDENCE — What relevant information has been reviewed?\nDONE — What has already happened?\nOPEN — What is unresolved?\nNEXT — What should happen next?\nOWNER — Who is responsible now?\nSOURCE — Where can the next person verify the details?", "unlockModule": 2, "unlockLesson": 5, "for": "A good handoff gives the next person enough context to continue the work without having to reconstruct what happened.", "when": "A lending capability issue is moving from one coach to another while the first coach is away. The handoff needs the background, evidence reviewed, actions already taken, unresolved questions and the next expected step.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m4l6", "title": "End-to-end communication challenge", "category": "Outlook", "text": "MODULE 4 COMMUNICATION PLAYBOOK\n\n1. VERIFY THE SOURCE — Confirm the facts first.\n2. DEFINE THE AUDIENCE — Know who each message is for.\n3. DEFINE THE ACTION — Be clear about what should happen next.\n4. ADAPT THE FORMAT — Email, Teams summary, handoff or document.\n5. PRESERVE THE MEANING — Do not change verified facts.\n6. FINAL CHECK — Compare each output back to the source before sharing.", "unlockModule": 3, "unlockLesson": 6, "for": "This challenge combines the communication skills from Module 4.", "when": "A national lending quality review identifies three verified issues. You have an Excel summary, Teams discussion notes and a Word procedure reference. Prepare a short stakeholder update, a coach-facing Teams summary and an Outlook follow-up that asks for one clear action. All three outputs must remain consistent with the same verified evidence.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l1", "title": "Turning evidence into useful analysis", "category": "Verify", "text": "ANALYSIS FRAME\n\nFACTS — What is directly supported by the source?\nOBSERVATIONS — What patterns or changes are visible?\nINTERPRETATIONS — What might those patterns mean?\nGAPS — What information is missing?\nVERIFY — What needs confirmation before action?", "unlockModule": 3, "unlockLesson": 1, "for": "AI can help organise evidence, compare information and identify patterns, but it should not decide what the evidence means on its own.", "when": "A lending quality review includes application outcomes, rework data and coaching notes. You need Copilot to identify recurring patterns without turning those patterns into unsupported conclusions.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l2", "title": "Comparing options without bias", "category": "Decision Support", "text": "OPTION COMPARISON\n\nCRITERIA — Define the measures first.\nOPTION A — Assess against every criterion.\nOPTION B — Assess against every criterion.\nEVIDENCE — Show what supports each assessment.\nUNCERTAINTY — Flag missing information.\nDECISION — Keep the final judgement human.", "unlockModule": 3, "unlockLesson": 2, "for": "AI can help compare options when the comparison criteria are explicit.", "when": "Two approaches are being considered for improving lending quality: targeted coaching for high-rework teams or a broader national refresher. You want Copilot to compare both using impact, effort, evidence, risk and speed to implement.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l3", "title": "Using AI to prepare recommendations", "category": "Risk", "text": "RECOMMENDATION STRUCTURE\n\nISSUE — What is happening?\nEVIDENCE — What supports it?\nOPTION — What action is proposed?\nRATIONALE — Why does the evidence support it?\nRISKS — What could go wrong?\nASSUMPTIONS — What is not yet confirmed?\nMEASURE — How will you know if it worked?", "unlockModule": 3, "unlockLesson": 3, "for": "AI can help turn verified evidence into a structured recommendation draft.", "when": "You have verified that one lending team has a sustained rework issue concentrated in two application stages. You need a recommendation for a short targeted coaching intervention, including expected benefit, risks and what should be monitored.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l4", "title": "Identifying gaps before decisions", "category": "Verify", "text": "GAP CHECK\n\nKNOWN — What is confirmed?\nUNKNOWN — What information is missing?\nIMPACT — Which gaps could change the conclusion?\nQUESTION — What should be investigated?\nSOURCE — Where could the answer come from?\nHOLD — Which decisions should wait?", "unlockModule": 3, "unlockLesson": 5, "for": "One of the most useful analytical tasks for AI is identifying what is missing.", "when": "A performance report suggests slower approval times in one region, but the report does not include staffing levels, application complexity or system outage data. You need to identify what additional evidence would help explain the change.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l5", "title": "Building an evidence-based decision brief", "category": "Risk", "text": "ONE-PAGE DECISION BRIEF\n\nISSUE\nWhat needs a decision?\n\nEVIDENCE\nWhat is verified?\n\nOPTIONS\nWhat realistic choices exist?\n\nRECOMMENDATION\nWhat is proposed and why?\n\nRISKS\nWhat needs attention?\n\nNEXT STEP\nWhat happens after the decision?", "unlockModule": 3, "unlockLesson": 4, "for": "A decision brief should make it easy for someone else to understand the issue, evidence, options and recommendation.", "when": "Senior stakeholders need a one-page brief on a recurring lending quality issue. The brief must show the current position, evidence, options considered, recommendation, risks and next step.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m5l6", "title": "End-to-end decision support challenge", "category": "Risk", "text": "MODULE 5 DECISION SUPPORT PLAYBOOK\n\n1. GATHER — Identify the relevant verified sources.\n2. SEPARATE — Facts, observations and interpretations.\n3. COMPARE — Apply consistent criteria to options.\n4. GAP CHECK — Identify what is still unknown.\n5. RECOMMEND — Draft reasoning from evidence only.\n6. BRIEF — Present issue, evidence, options, risks and next step.\n7. DECIDE — Keep accountability and judgement human.", "unlockModule": 3, "unlockLesson": 6, "for": "This challenge combines Module 5.", "when": "A national lending review shows higher rework in two teams, mixed customer feedback and a recent procedure change. You have Excel data, Teams notes and the updated procedure document. Prepare a decision brief that separates verified facts, possible causes, evidence gaps, options and a recommendation for further action.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l1", "title": "Recognising high-risk AI outputs", "category": "Word", "text": "RISK CHECK\n\nLOW — Formatting, headings, wording alternatives.\nMEDIUM — Summaries, comparisons, internal drafts.\nHIGH — Policy, compliance, customer impact, financial figures, regulatory requirements.\n\nFOR HIGH-RISK OUTPUTS\n1. Identify the claim.\n2. Check the approved source.\n3. Confirm current wording.\n4. Correct or remove unsupported content.\n5. Record the source used.", "unlockModule": 4, "unlockLesson": 1, "for": "Not every AI output carries the same level of risk.", "when": "Copilot drafts a coaching summary that includes a statement about when a particular lending requirement must be applied. The wording sounds confident, but the source material does not contain the current policy text.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l2", "title": "Privacy and minimum necessary information", "category": "Privacy", "text": "MINIMUM NECESSARY CHECK\n\nPURPOSE — What does AI actually need to do?\nNEEDED — Which fields or details support that task?\nREMOVE — What personal or sensitive detail is unnecessary?\nAPPROVED — Is the AI environment approved for the information being used?\nACCESS — Should the user of the output have access to the source?", "unlockModule": 4, "unlockLesson": 2, "for": "Good AI practice means using only the information required for the task.", "when": "You want Copilot to help identify coaching themes from several returned lending applications. The examples include names, contact details and account information that are not necessary for identifying the coaching pattern.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l3", "title": "Working with policy and approved sources", "category": "Word", "text": "POLICY-SAFE PROMPT\n\nSOURCE — Use only the current approved document.\nTASK — Explain or summarise the specified section.\nPRESERVE — Do not change requirements, thresholds or conditions.\nREFERENCE — Identify the source section for each important point.\nVERIFY — Compare the final wording back to the approved source.", "unlockModule": 4, "unlockLesson": 3, "for": "When AI is used around policy, procedure or regulated work, the approved source remains the authority.", "when": "A coach asks Copilot to explain a lending procedure in simpler language for a team discussion. Before using the explanation, you need to make sure the meaning and conditions still match the current approved procedure.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l4", "title": "Traceability and evidence trails", "category": "Meetings", "text": "TRACEABILITY MAP\n\nCLAIM — What important statement is being made?\nSOURCE — Where did the supporting evidence come from?\nLOCATION — Which section, table, note or meeting supports it?\nSTATUS — Verified, uncertain or unresolved?\nUSE — Where does the claim appear in the final output?", "unlockModule": 4, "unlockLesson": 4, "for": "For important work, you should be able to trace an AI-assisted output back to the evidence that supports it.", "when": "You are preparing a lending capability brief using Excel data, a Word procedure update and Teams notes. Each important statement in the brief should be traceable to one of those sources.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l5", "title": "Keeping human accountability", "category": "Risk", "text": "HUMAN ACCOUNTABILITY CHECK\n\nEVIDENCE — Have the important facts been verified?\nCONTEXT — Is there relevant information AI may not have?\nRISK — Could the action affect customers, policy or regulated work?\nALTERNATIVES — Were reasonable options considered?\nDECISION — Who owns the final judgement?\nRECORD — What evidence supports the action taken?", "unlockModule": 4, "unlockLesson": 5, "for": "AI can support analysis, drafting and preparation, but responsibility for consequential workplace decisions stays with people.", "when": "Copilot recommends that a regional lending team receive a targeted intervention based on performance data and coaching notes. The recommendation is useful, but a person still needs to review the evidence, risks and context before deciding what happens next.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m6l6", "title": "End-to-end governance challenge", "category": "Risk", "text": "MODULE 6 GOVERNANCE PLAYBOOK\n\n1. CLASSIFY — How consequential is the AI output?\n2. MINIMISE — Use only the information necessary.\n3. APPROVE — Work inside approved systems and access rules.\n4. VERIFY — Check figures, policy, compliance and customer-impacting claims.\n5. TRACE — Connect important statements back to evidence.\n6. REVIEW — Consider context, uncertainty and alternatives.\n7. OWN — Keep the final decision and accountability human.", "unlockModule": 4, "unlockLesson": 6, "for": "This challenge combines Module 6.", "when": "You are preparing a national lending capability brief from Excel performance data, Teams coaching notes and a Word procedure update. The brief contains figures, possible causes, a policy reference and a recommended action. Build a workflow that protects sensitive information, verifies high-risk claims, keeps a traceable evidence trail and makes the final decision clearly human-owned.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l1", "title": "What an AI agent is", "category": "Automation", "text": "AGENT STARTER FRAME\n\nGOAL — What repeatable outcome is needed?\nINPUTS — What approved information can the agent use?\nTOOLS — What systems may it access?\nRULES — What must it always or never do?\nSTOP — When must it hand control to a person?\nREVIEW — What must be checked before the result is used?", "unlockModule": 5, "unlockLesson": 1, "for": "An AI agent is a system that can work through a task using instructions, available tools and defined rules rather than waiting for every individual prompt.", "when": "A lending capability team receives the same weekly inputs from several regions. Someone manually collects the files, checks that required fields are present and prepares a standard summary. You want to identify which steps could be handled by an agent and which still require human review.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l2", "title": "Finding safe automation opportunities", "category": "Analyse", "text": "AUTOMATE / ASSIST / HUMAN\n\nAUTOMATE — Repetitive + rules-based + low consequence.\nASSIST — AI prepares analysis or draft; person reviews.\nHUMAN — Judgement, policy interpretation, approval or customer-impacting decisions.\n\nSTART SMALL\nChoose one narrow workflow and prove it before expanding.", "unlockModule": 5, "unlockLesson": 2, "for": "The best first automation opportunities are repetitive, rules-based and low consequence.", "when": "Your weekly workflow includes renaming files, checking whether all regional reports arrived, summarising meeting notes, interpreting lending policy and deciding which team needs intervention.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l3", "title": "Designing an agent workflow", "category": "Automation", "text": "AGENT WORKFLOW MAP\n\nTRIGGER — What starts the workflow?\nINPUTS — What information is expected?\nACTIONS — What may the agent do?\nCHECKS — What conditions must be validated?\nESCALATION — What causes the agent to stop or flag an issue?\nAPPROVAL — What must a person review before completion?", "unlockModule": 5, "unlockLesson": 3, "for": "A reliable agent workflow has a clear trigger, defined inputs, limited actions, validation checks and an escalation path.", "when": "Each Monday, regional lending reports arrive in a shared Microsoft 365 location. An agent could check that all reports are present, flag missing submissions and prepare a standard summary for review.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l4", "title": "Approvals and exception handling", "category": "Decision Support", "text": "APPROVAL GATES\n\nNORMAL — What can continue automatically?\nEXCEPTION — What conditions trigger a stop?\nOWNER — Who reviews the exception?\nEVIDENCE — What information must be shown for review?\nDECISION — What actions may the reviewer take?\nRESUME — When may automation continue?", "unlockModule": 5, "unlockLesson": 4, "for": "Automation is strongest when normal cases can move quickly and exceptions are deliberately routed to people.", "when": "An agent prepares a weekly lending summary. If every report is complete and figures reconcile, it can prepare the draft. If a figure is missing, inconsistent or linked to a policy-sensitive issue, the workflow must stop and flag it.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l5", "title": "Testing before automation goes live", "category": "Automation", "text": "AUTOMATION TEST SET\n\n1. NORMAL CASE — Expected inputs and outcome.\n2. MISSING INPUT — Does it stop or flag correctly?\n3. BAD INPUT — Does validation catch it?\n4. DUPLICATE / CONFLICT — Does it escalate?\n5. UNEXPECTED CASE — Does it fail safely?\n\nPASS CRITERIA\nDefine expected behaviour before testing.", "unlockModule": 5, "unlockLesson": 5, "for": "Before an automated workflow is trusted, test normal cases, missing data, incorrect data and unusual cases.", "when": "You have built a prototype that checks regional lending reports and prepares a summary. You need a test set covering complete reports, missing reports, duplicate reports, inconsistent totals and an unexpected file format.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m7l6", "title": "End-to-end agent challenge", "category": "Automation", "text": "MODULE 7 AGENT PLAYBOOK\n\n1. NARROW THE TASK.\n2. DEFINE APPROVED INPUTS AND TOOLS.\n3. WRITE EXPLICIT RULES AND STOP CONDITIONS.\n4. BUILD VALIDATION CHECKS.\n5. ROUTE EXCEPTIONS TO PEOPLE.\n6. REQUIRE APPROVAL FOR CONSEQUENTIAL OUTPUTS.\n7. TEST NORMAL AND FAILURE CASES BEFORE USE.", "unlockModule": 5, "unlockLesson": 6, "for": "This challenge combines Module 7.", "when": "Design an agent-assisted weekly lending capability workflow that checks report completeness, creates a draft summary, flags anomalies and prepares the result for a human reviewer. It must never interpret policy or make a coaching decision on its own.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l1", "title": "Building multi-app Copilot workflows", "category": "Excel", "text": "MULTI-APP FLOW\n\nTEAMS — Capture discussion, decisions and actions.\nEXCEL — Analyse verified measures and trends.\nOUTLOOK — Extract relevant feedback and requests.\nWORD — Synthesize trusted evidence into the final document.\n\nHANDOFF RULE\nCarry forward only what is needed and verified.", "unlockModule": 2, "unlockLesson": 1, "for": "Advanced Copilot use is not about using more features.", "when": "You need to prepare a monthly lending capability review using a Teams meeting, an Excel workbook, an Outlook feedback thread and a Word report template.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l2", "title": "Working with long email threads", "category": "Outlook", "text": "THREAD SUMMARY\n\nCURRENT POSITION — What is now confirmed?\nDECISIONS — What has been agreed?\nACTIONS — What needs to happen?\nOWNERS — Who is responsible?\nDATES — What deadlines matter?\nOPEN QUESTIONS — What is unresolved?\nHISTORY — Keep earlier proposals separate from the current position.", "unlockModule": 2, "unlockLesson": 2, "for": "Long email threads contain repeated information, changed decisions and unresolved questions.", "when": "An Outlook thread about a lending process change contains twelve replies. Early messages proposed one approach, but the final replies confirm a different action.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l3", "title": "Using Word for structured synthesis", "category": "Word", "text": "STRUCTURED SYNTHESIS\n\nSECTION 1 — Verified evidence.\nSECTION 2 — Observations and patterns.\nSECTION 3 — Risks / implications.\nSECTION 4 — Agreed actions.\nSECTION 5 — Open questions.\n\nRULE\nIf the source does not support a point, mark it unresolved rather than completing it.", "unlockModule": 2, "unlockLesson": 3, "for": "Word is useful when several verified inputs need to become one coherent working document.", "when": "You have verified performance findings, coaching themes and a procedure update. The monthly capability report needs sections for evidence, interpretation, risks, actions and open questions.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l4", "title": "Using Excel for deeper comparison", "category": "Excel", "text": "EXCEL ANALYSIS BRIEF\n\nRANGE — What data is included?\nPERIOD — What time periods are compared?\nMEASURES — Which metrics matter?\nTHRESHOLD — What counts as meaningful?\nOUTPUT — What table or summary is required?\nVERIFY — Show the figures behind each observation.", "unlockModule": 3, "unlockLesson": 2, "for": "Excel Copilot can help compare periods, teams and measures when the question is explicit.", "when": "You need to compare rework, turnaround and volume across regions over three months and identify which changes are both large and sustained.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l5", "title": "Creating reusable Microsoft 365 templates", "category": "Verify", "text": "M365 WORKFLOW TEMPLATE\n\nSOURCES — What must be available?\nPROMPTS — What repeatable task is performed in each app?\nHANDOFFS — What trusted information moves forward?\nCHECKS — What is verified every time?\nVARIABLES — What changes each cycle?\nARCHIVE — Where is the approved final output stored?", "unlockModule": 2, "unlockLesson": 6, "for": "When a workflow repeats, save the successful prompts, document structure and review checks as a reusable template.", "when": "Your monthly lending review follows the same Teams → Excel → Outlook → Word sequence. You want a reusable checklist and prompt set that can be used each month.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m8l6", "title": "Advanced Copilot challenge", "category": "Word", "text": "MODULE 8 COPILOT ORCHESTRATION\n\n1. START WITH THE APP THAT HOLDS THE SOURCE.\n2. GIVE COPILOT ONE CLEAR TASK.\n3. VERIFY IMPORTANT OUTPUTS IN THAT APP.\n4. CARRY ONLY TRUSTED INFORMATION FORWARD.\n5. SYNTHESIZE IN THE FINAL WORKING DOCUMENT.\n6. CHECK THE FINAL OUTPUT BACK TO SOURCE EVIDENCE.", "unlockModule": 2, "unlockLesson": 6, "for": "This challenge combines Module 8.", "when": "Produce a monthly lending capability review from Teams, Excel, Outlook and Word. The result must identify verified performance changes, confirmed stakeholder feedback, current procedure impacts, actions and unresolved questions.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l1", "title": "From prompt to process", "category": "Verify", "text": "PROMPT → PROCESS\n\nINPUTS — Required sources.\nTASK — Standard AI instruction.\nCHECKS — Mandatory verification.\nOUTPUT — Defined format.\nOWNER — Person responsible.\nSTORAGE — Where approved output lives.\nREVIEW CYCLE — When the process is updated.", "unlockModule": 5, "unlockLesson": 1, "for": "A good prompt solves one task.", "when": "A weekly lending quality summary is currently created with a successful Copilot prompt, but every user collects different source files and reviews the answer differently.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l2", "title": "Standardising inputs", "category": "Verify", "text": "INPUT STANDARD\n\nSOURCE — Approved location.\nNAME — Consistent naming rule.\nPERIOD — Required reporting period.\nFIELDS — Mandatory measures / sections.\nFORMAT — Accepted structure.\nVALIDATION — What must be checked before AI processing begins?", "unlockModule": 5, "unlockLesson": 3, "for": "AI workflows become more reliable when the expected inputs are consistent.", "when": "Regional lending reports arrive in different formats and use slightly different headings, making the weekly summary slow to prepare.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l3", "title": "Creating quality checks", "category": "Excel", "text": "QUALITY GATE\n\n[ ] Required inputs present.\n[ ] Figures match source.\n[ ] Missing data is flagged.\n[ ] Observation is separated from interpretation.\n[ ] Policy statements cite approved source.\n[ ] Actions and owners are confirmed.\n[ ] Final human reviewer identified.", "unlockModule": 5, "unlockLesson": 4, "for": "Repeatable systems need repeatable quality checks.", "when": "The weekly lending summary must always preserve source figures, identify missing regions, separate observation from cause and cite policy references when used.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l4", "title": "Documenting the system", "category": "Word", "text": "ONE-PAGE AI SYSTEM GUIDE\n\nPURPOSE\nSCOPE\nREQUIRED INPUTS\nWORKFLOW STEPS\nAI PROMPT / TEMPLATE\nQUALITY CHECKS\nEXCEPTIONS / STOP RULES\nOWNER / APPROVER\nOUTPUT LOCATION\nREVIEW DATE", "unlockModule": 5, "unlockLesson": 6, "for": "A workplace AI system should be understandable by someone other than its creator.", "when": "Another lending coach needs to run the weekly summary while the usual owner is away. They should be able to understand the process without reconstructing it from old prompts.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l5", "title": "Improving without breaking the workflow", "category": "Decision Support", "text": "CONTROLLED IMPROVEMENT\n\nCURRENT — What works today?\nCHANGE — What one thing will change?\nEXPECTED BENEFIT — Time, quality or usability?\nTEST — What examples will be run?\nQUALITY CRITERIA — What must remain true?\nDECISION — Keep, revise or revert.", "unlockModule": 5, "unlockLesson": 5, "for": "When an AI workflow works, improve it deliberately.", "when": "You want to shorten the weekly lending summary process by combining two steps. Before changing it permanently, you need to test whether the new sequence preserves the same evidence and quality checks.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m9l6", "title": "System-building challenge", "category": "Word", "text": "MODULE 9 SYSTEM PLAYBOOK\n\n1. STANDARDISE INPUTS.\n2. DEFINE THE REPEATABLE AI TASK.\n3. BUILD QUALITY GATES.\n4. DOCUMENT THE FULL WORKFLOW.\n5. DEFINE OWNERSHIP AND EXCEPTIONS.\n6. STORE APPROVED OUTPUTS CONSISTENTLY.\n7. IMPROVE THROUGH CONTROLLED CHANGES.", "unlockModule": 5, "unlockLesson": 6, "for": "This challenge combines Module 9.", "when": "Build a documented weekly lending capability reporting system using regional inputs, Copilot analysis, quality gates and a final approved Word brief.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l1", "title": "Finding the right problem", "category": "Automation", "text": "PROBLEM STATEMENT\n\nWORKFLOW — What work is happening?\nFRICTION — Where is time or quality being lost?\nWHO — Who experiences the problem?\nEVIDENCE — What shows the problem is real?\nBOUNDARY — What is outside the problem scope?", "unlockModule": 5, "unlockLesson": 1, "for": "AI projects should start with a real workflow problem, not with a feature looking for somewhere to be used.", "when": "A lending capability team spends several hours each week manually consolidating regional quality reports before any analysis begins.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l2", "title": "Mapping the current workflow", "category": "Risk", "text": "AS-IS MAP\n\nSTEP\nINPUT\nTASK\nOWNER\nSYSTEM\nHANDOFF\nWAIT / DELAY\nREWORK\nCONTROL\n\nMARK\nWhere does time, duplication or risk accumulate?", "unlockModule": 5, "unlockLesson": 2, "for": "Before changing a workflow, map how it operates today.", "when": "Regional reports move through email, spreadsheets, Teams messages and a final Word document. Different people perform manual checks at different stages.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l3", "title": "Designing the improved workflow", "category": "Analyse", "text": "TO-BE WORKFLOW\n\nREMOVE — What unnecessary step disappears?\nAUTOMATE — What repetitive rule-based work can run automatically?\nASSIST — Where can AI prepare analysis or drafts?\nHUMAN — Where is judgement / approval required?\nCONTROL — What checks remain mandatory?\nMEASURE — What improvement should result?", "unlockModule": 5, "unlockLesson": 3, "for": "The improved workflow should remove unnecessary work while preserving the controls that matter.", "when": "You want to redesign the weekly reporting workflow so report completeness is checked automatically, Copilot drafts the analysis and a person verifies the final brief.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l4", "title": "Defining success measures", "category": "Automation", "text": "VALUE MEASURES\n\nBASELINE — Current time / quality / rework.\nTARGET — Expected improvement.\nQUALITY GUARDRAIL — What must not get worse?\nADOPTION — Are intended users able to use the workflow?\nREVIEW — When will results be assessed?", "unlockModule": 5, "unlockLesson": 5, "for": "An AI improvement needs measurable outcomes.", "when": "The reporting workflow currently takes four hours each week and often requires follow-up for missing data. You want to know whether the new workflow genuinely improves the process.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l5", "title": "Running a controlled pilot", "category": "Risk", "text": "PILOT PLAN\n\nSCOPE — What workflow and users are included?\nDURATION — How long will the test run?\nBASELINE — What are we comparing against?\nMEASURES — Time, quality, rework, usability.\nRISKS — What needs watching?\nSTOP CONDITIONS — What would pause the pilot?\nREVIEW — Who decides whether to expand?", "unlockModule": 5, "unlockLesson": 5, "for": "Test an improved workflow with a limited scope before broad use.", "when": "You want to trial the redesigned reporting workflow with two regions for four weeks before expanding it nationally.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m10l6", "title": "Lending transformation challenge", "category": "Automation", "text": "MODULE 10 TRANSFORMATION PLAYBOOK\n\n1. DEFINE THE REAL WORKFLOW PROBLEM.\n2. MAP THE CURRENT PROCESS.\n3. IDENTIFY AUTOMATE / ASSIST / HUMAN STEPS.\n4. DESIGN THE IMPROVED WORKFLOW.\n5. DEFINE BASELINE, TARGET AND GUARDRAILS.\n6. RUN A CONTROLLED PILOT.\n7. EXPAND ONLY WHEN THE EVIDENCE SUPPORTS IT.", "unlockModule": 5, "unlockLesson": 6, "for": "This challenge combines Module 10.", "when": "Regional lending quality reporting is slow, inconsistent and heavily manual. Build a proposal that maps the current process, identifies the best AI opportunities, designs the improved workflow and defines a limited pilot.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l1", "title": "Choose the project", "category": "Reporting", "text": "PROJECT ONE-PAGER — PART 1\n\nPROJECT NAME\nPROBLEM\nPRIMARY USER\nCURRENT FRICTION\nDESIRED OUTCOME\nIN SCOPE\nOUT OF SCOPE", "unlockModule": 6, "unlockLesson": 1, "for": "Your implementation project should solve one bounded workplace problem that is important enough to matter and small enough to test.", "when": "Choose one lending capability workflow such as weekly reporting, meeting follow-up, procedure-change communication, document comparison or quality analysis.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l2", "title": "Define evidence and requirements", "category": "Privacy", "text": "PROJECT ONE-PAGER — PART 2\n\nTRUSTED SOURCES\nREQUIRED INPUTS\nPRIVACY / ACCESS\nHIGH-RISK CLAIMS\nMANDATORY CHECKS\nHUMAN DECISIONS\nAPPROVAL OWNER", "unlockModule": 6, "unlockLesson": 2, "for": "Before designing the AI solution, define what sources are trusted, what information is required and which constraints cannot be compromised.", "when": "Your project depends on Excel performance data, Teams notes and an approved Word procedure. Some outputs could influence coaching priorities.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l3", "title": "Design the workflow", "category": "Automation", "text": "PROJECT ONE-PAGER — PART 3\n\nTRIGGER\nINPUTS\nAI TASK(S)\nVALIDATION CHECKS\nEXCEPTIONS\nHUMAN REVIEW\nFINAL OUTPUT\nSTORAGE / HANDOFF", "unlockModule": 6, "unlockLesson": 3, "for": "Turn the project into a step-by-step workflow.", "when": "Design the sequence from source collection through AI assistance to final approved output.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l4", "title": "Create the test plan", "category": "Risk", "text": "PROJECT ONE-PAGER — PART 4\n\nTEST 1 — Normal case.\nTEST 2 — Missing input.\nTEST 3 — Conflicting / incorrect information.\nTEST 4 — High-risk / policy-sensitive case.\n\nFOR EACH\nExpected behaviour\nPass / fail criteria\nRequired human action", "unlockModule": 6, "unlockLesson": 4, "for": "A project is not ready because the normal example worked.", "when": "Your workflow must handle normal data, missing inputs, conflicting information and a policy-sensitive case.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l5", "title": "Plan the pilot and measurement", "category": "Risk", "text": "PROJECT ONE-PAGER — PART 5\n\nPILOT USERS\nDURATION\nBASELINE\nPRODUCTIVITY TARGET\nQUALITY GUARDRAIL\nRISKS\nSTOP CONDITIONS\nREVIEW DATE\nEXPANSION DECISION", "unlockModule": 6, "unlockLesson": 5, "for": "The pilot should test whether the project creates value without weakening quality or control.", "when": "You will test the workflow with a small group for four weeks before any wider rollout.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m11l6", "title": "Implementation project submission", "category": "Privacy", "text": "MODULE 11 IMPLEMENTATION BRIEF\n\n1. PROBLEM + SCOPE\n2. USER + OUTCOME\n3. TRUSTED SOURCES\n4. WORKFLOW\n5. AI BOUNDARIES\n6. PRIVACY / RISK CONTROLS\n7. HUMAN APPROVAL\n8. TEST CASES\n9. PILOT PLAN\n10. SUCCESS MEASURES\n11. STOP CONDITIONS\n12. REVIEW / EXPANSION DECISION", "unlockModule": 6, "unlockLesson": 6, "for": "This challenge brings the project together into one implementation-ready brief.", "when": "Prepare the final project brief for your chosen lending workflow.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l1", "title": "Capstone brief", "category": "Risk", "text": "CAPSTONE PLAN\n\nSOURCES\nAI TASKS\nMICROSOFT 365 APPS\nVERIFICATION POINTS\nHIGH-RISK AREAS\nHUMAN DECISIONS\nFINAL OUTPUTS\nREUSABLE WORKFLOW", "unlockModule": 6, "unlockLesson": 1, "for": "The capstone combines the academy into one practical lending scenario.", "when": "A national lending capability review requires you to combine performance data, meeting notes, stakeholder feedback and a procedure update into a decision-ready brief and repeatable follow-up workflow.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l2", "title": "Evidence and source control", "category": "Verify", "text": "CAPSTONE SOURCE MAP\n\nCLAIM\nSOURCE\nLOCATION\nVERIFICATION METHOD\nSTATUS — Verified / unresolved\nFINAL USE", "unlockModule": 6, "unlockLesson": 2, "for": "Capstone evidence must remain traceable to trusted sources.", "when": "Your review contains figures from Excel, decisions from Teams and requirements from a Word procedure document.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l3", "title": "Analysis and communication", "category": "Verify", "text": "CAPSTONE COMMUNICATION\n\nCOMMON SOURCE — Verified evidence.\nSTAKEHOLDER OUTPUT — Decision-ready summary.\nCOACH OUTPUT — Practical implications / actions.\nPRESERVE — Facts, figures, policy meaning.\nADAPT — Detail, language, format.\nFINAL CHECK — Compare both versions to source.", "unlockModule": 6, "unlockLesson": 3, "for": "A complete workplace outcome usually requires both analysis and communication.", "when": "Prepare one decision-ready summary for senior stakeholders and one practical follow-up for lending coaches from the same verified evidence.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l4", "title": "Risk and governance assessment", "category": "Excel", "text": "CAPSTONE RISK REVIEW\n\nDATA MINIMISED?\nAPPROVED SYSTEM?\nHIGH-RISK CLAIMS IDENTIFIED?\nPOLICY / FIGURES VERIFIED?\nSOURCE TRAIL RECORDED?\nUNCERTAINTY SHOWN?\nHUMAN APPROVER IDENTIFIED?", "unlockModule": 6, "unlockLesson": 4, "for": "Before finalising the capstone, apply the governance controls from Module 6.", "when": "The capstone includes performance figures, a policy reference and a proposed capability action.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l5", "title": "Build the reusable system", "category": "Verify", "text": "CAPSTONE OPERATING GUIDE\n\nPURPOSE\nTRIGGER\nREQUIRED INPUTS\nAPPROVED SOURCES\nAI TASKS / PROMPTS\nQUALITY CHECKS\nEXCEPTIONS\nHUMAN APPROVAL\nFINAL OUTPUTS\nSTORAGE\nREVIEW / UPDATE CYCLE", "unlockModule": 6, "unlockLesson": 5, "for": "The final capstone step is to turn the successful workflow into something reusable.", "when": "Your monthly lending capability review worked. Another coach should be able to repeat it next month using the same controlled process.", "app": "Microsoft 365 / approved workplace AI"}, {"id": "m12l6", "title": "Final academy assessment", "category": "Risk", "text": "AI COACH ACADEMY — FINAL METHOD\n\n1. DEFINE — What job needs doing?\n2. SOURCE — What trusted information should AI use?\n3. ASSIST — What specific part can AI do well?\n4. VERIFY — What facts, figures, policy or risks must be checked?\n5. OWN — What judgement or approval remains human?\n6. REUSE — What successful prompt, workflow or checklist should be saved?\n\nCOURSE COMPLETE.", "unlockModule": 6, "unlockLesson": 6, "for": "This final assessment checks the complete working method taught across AI Coach Academy: define the task, use the right source and tool, verify important output, manage risk, keep judgement human and make successful work reusable.", "when": "You receive a new lending capability task with incomplete notes, performance data, a policy reference and a deadline. You must decide how AI can assist without treating its output as authority.", "app": "Microsoft 365 / approved workplace AI"}]};
const KEY='aiCoachAcademyV03';

function dev(){return localStorage.getItem(DEVKEY)==='true'}
function setDev(v){localStorage.setItem(DEVKEY,String(v));renderLearn()}
function lessonKey(m,l){return `${m}-${l}`}
function complete(m,l,s=state()){return !!s.lessons[lessonKey(m,l)]}
function moduleComplete(m,s=state()){return DATA.lessons.filter(x=>x.module===m).every(x=>complete(m,x.lesson,s))}
function unlocked(m,l,s=state()){if(dev())return true;if(m===1&&l===1)return true;if(l>1)return complete(m,l-1,s);return moduleComplete(m-1,s)}
function tkUnlocked(t,s=state()){return dev()||complete(t.unlockModule,t.unlockLesson,s)}
function academyDone(s=state()){return DATA.modules.every(m=>moduleComplete(m.id,s))}
function navActive(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id))}
function show(view){['learn','workspace','toolkits','certificates','lesson','toolDetail'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(view).classList.remove('hidden');navActive(view==='lesson'?'learn':view==='toolDetail'?'toolkits':view);window.scrollTo({top:0,behavior:'smooth'})}
function progress(){const s=state(), total=DATA.lessons.length, done=DATA.lessons.filter(l=>complete(l.module,l.lesson,s)).length;return {done,total,pct:Math.round(done/total*100)}}
function renderLearn(){const s=state(),p=progress();let out=`<section class="card"><div class="section-label">Academy</div><h2>Learn</h2><p class="muted">${p.done} of ${p.total} lessons complete</p><div class="progress"><span style="width:${p.pct}%"></span></div></section>`;
DATA.modules.forEach(m=>{const ls=DATA.lessons.filter(x=>x.module===m.id),done=ls.filter(x=>complete(m.id,x.lesson,s)).length,open=dev()||m.id===1||moduleComplete(m.id-1,s);out+=`<section class="card ${open?'':'locked'}"><div class="section-label">Module ${m.id}</div><h2>${m.title}</h2><p class="muted">${m.subtitle}</p><p class="small">${done}/${ls.length} lessons complete</p><div class="actions"><button ${open?'':'disabled'} onclick="renderModule(${m.id})">${done===ls.length?'Review module':open?'Open module':'Complete previous module'}</button></div></section>`});
if(academyDone(s))out+=`<section class="card success"><div class="section-label">Academy complete</div><h2>AI Coach Academy completed</h2><button onclick="showCertificates()">View graduation</button></section>`;
out+=`<section class="card dev"><div class="section-label">Developer Mode</div><p class="small">Build testing only. Unlocks lessons and toolkits without changing completion records.</p><div class="actions"><button class="secondary" onclick="setDev(${!dev()})">${dev()?'Turn Developer Mode off':'Turn Developer Mode on'}</button><button class="ghost" onclick="resetAll()">Reset local test data</button></div></section>`;document.getElementById('learn').innerHTML=out;show('learn')}
function renderModule(mid){const m=DATA.modules.find(x=>x.id===mid),s=state(),ls=DATA.lessons.filter(x=>x.module===mid);let out=`<section class="card"><div class="section-label">Module ${mid}</div><h2>${m.title}</h2><p class="muted">${m.subtitle}</p>`;ls.forEach(l=>{const done=complete(mid,l.lesson,s),open=unlocked(mid,l.lesson,s);out+=`<div class="lesson-row"><div class="lesson-icon">${done?'✓':l.lesson}</div><div class="grow"><strong>Lesson ${l.lesson} — ${l.title}</strong><div class="small">${done?'Completed':open?'Ready to start':'Locked'}</div></div><button class="secondary" ${open?'':'disabled'} onclick="openLesson(${mid},${l.lesson})">${done?'Review':'Open'}</button></div>`});out+=`<div class="actions"><button class="secondary" onclick="renderLearn()">Back to modules</button></div></section>`;document.getElementById('learn').innerHTML=out;show('learn')}
function openLesson(m,l){currentLesson=DATA.lessons.find(x=>x.module===m&&x.lesson===l);selectedAnswer=null;document.getElementById('lesson').innerHTML=`<section class="card"><div class="section-label">Module ${m} · Lesson ${l}</div><h2>${currentLesson.title}</h2><div class="lesson-meta"><span class="badge">15–20 min</span><span class="badge">Lending scenario</span></div><h3>Concept</h3><p>${currentLesson.concept}</p></section><section class="card"><h3>Workplace scenario</h3><p>${currentLesson.scenario}</p></section><section class="card"><h3>Practical exercise</h3><p>${currentLesson.exercise}</p><textarea id="exercise" placeholder="Write your response here…"></textarea><button onclick="showCheck()">Continue to understanding check</button></section><section id="checkCard" class="card hidden"></section>`;show('lesson')}
function showCheck(){const v=document.getElementById('exercise').value.trim();if(v.length<currentLesson.min){alert('Add a little more detail before continuing.');return}const c=document.getElementById('checkCard');c.classList.remove('hidden');c.innerHTML=`<h3>Understanding check</h3><p>${currentLesson.check}</p>${currentLesson.answers.map((a,i)=>`<div class="option" onclick="pick(this,${i})">${a}</div>`).join('')}<button id="checkBtn" disabled onclick="checkAnswer()">Check answer</button>`;c.scrollIntoView({behavior:'smooth'})}
function pick(el,i){selectedAnswer=i;document.querySelectorAll('#checkCard .option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.getElementById('checkBtn').disabled=false}
function checkAnswer(){if(selectedAnswer!==currentLesson.correct){alert('Not quite. Review the concept and choose the answer that keeps evidence, verification and human judgement clear.');return}const s=state();s.lessons[lessonKey(currentLesson.module,currentLesson.lesson)]=true;if(moduleComplete(currentLesson.module,s)&&!s.certDates[currentLesson.module])s.certDates[currentLesson.module]=new Date().toISOString();if(academyDone(s)){s.graduated=true;s.certDates.academy=s.certDates.academy||new Date().toISOString()}save(s);const unlockedTools=DATA.toolkits.filter(t=>t.unlockModule===currentLesson.module&&t.unlockLesson===currentLesson.lesson);document.getElementById('checkCard').innerHTML=`<div class="success card"><h3>Understanding confirmed</h3><p>${unlockedTools.length} workplace toolkit${unlockedTools.length===1?'':'s'} now available in your Toolkit Library.</p><div class="actions"><button onclick="renderModule(${currentLesson.module})">Return to module</button><button class="secondary" onclick="renderToolkits()">Open Toolkits</button></div></div>`}
function renderToolkits(filter='All',q=''){const s=state();const cats=['All',...new Set(DATA.toolkits.map(t=>t.category))];let list=DATA.toolkits.filter(t=>(filter==='All'||t.category===filter)&&(!q||(`${t.title} ${t.category} ${t.text}`).toLowerCase().includes(q.toLowerCase())));let out=`<section class="card"><div class="section-label">Reference Library</div><h2>Toolkits</h2><p class="muted">Find tools by workplace intent, not lesson number.</p><input type="search" id="toolSearch" placeholder="Search compare, Teams, verify…" value="${q.replace(/"/g,'&quot;')}" oninput="renderToolkits('${filter}',this.value)"><div class="chipbar">${cats.map(c=>`<button class="${c===filter?'':'secondary'} chip" onclick="renderToolkits('${c}','${q.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div></section>`;list.forEach(t=>{const open=tkUnlocked(t,s);out+=`<section class="card ${open?'':'locked'}"><span class="badge">${t.category}</span><h3>${t.title}</h3><p class="small">${open?t.for:`Unlocks after Module ${t.unlockModule}, Lesson ${t.unlockLesson}`}</p><div class="actions"><button ${open?'':'disabled'} onclick="openToolkit('${t.id}')">${open?'Open toolkit':'Locked'}</button></div></section>`});document.getElementById('toolkits').innerHTML=out;show('toolkits')}
function openToolkit(id){const t=DATA.toolkits.find(x=>x.id===id),s=state();if(!tkUnlocked(t,s))return;s.recent=[id,...s.recent.filter(x=>x!==id)].slice(0,8);save(s);document.getElementById('toolDetail').innerHTML=`<section class="card"><span class="badge">${t.category}</span><h2>${t.title}</h2><h3>What it is for</h3><p>${t.for}</p><h3>When to use it</h3><p>${t.when}</p><h3>30-second version / full workflow</h3><div class="toolkit">${t.text}</div><h3>Microsoft 365 guidance</h3><p>${t.app}. Work where the source already lives, then verify consequential outputs before reuse.</p><div class="actions"><button onclick="copyText(${JSON.stringify(t.text)})">Copy toolkit</button><button class="secondary" onclick="toggleWorkspace('${id}')">${s.workspace.includes(id)?'Remove from Workspace':'Add to Workspace'}</button><button class="secondary" onclick="togglePin('${id}')">${s.pinned.includes(id)?'Unpin':'Pin favourite'}</button></div></section>`;show('toolDetail')}
function copyText(txt){navigator.clipboard.writeText(txt).then(()=>alert('Toolkit copied.'))}
function toggleWorkspace(id){const s=state();s.workspace=s.workspace.includes(id)?s.workspace.filter(x=>x!==id):[...s.workspace,id];save(s);openToolkit(id)}
function togglePin(id){const s=state();s.pinned=s.pinned.includes(id)?s.pinned.filter(x=>x!==id):[...s.pinned,id];save(s);openToolkit(id)}
function moveTool(id,dir){const s=state(),i=s.workspace.indexOf(id),j=i+dir;if(i<0||j<0||j>=s.workspace.length)return;[s.workspace[i],s.workspace[j]]=[s.workspace[j],s.workspace[i]];save(s);renderWorkspace()}
function removeWorkspace(id){const s=state();s.workspace=s.workspace.filter(x=>x!==id);s.pinned=s.pinned.filter(x=>x!==id);save(s);renderWorkspace()}
function renderWorkspace(){const s=state();const items=s.workspace.map(id=>DATA.toolkits.find(t=>t.id===id)).filter(Boolean);let out=`<section class="card"><div class="section-label">Personal workspace</div><h2>My Workspace</h2><p class="muted">Your layout stays where you put it. Nothing rearranges automatically.</p></section>`;if(!items.length)out+=`<section class="card"><h3>Build your everyday screen</h3><p class="muted">Open an unlocked toolkit and choose <strong>Add to Workspace</strong>. Frequently used tools stay in the position you choose.</p><button onclick="renderToolkits()">Browse Toolkits</button></section>`;else{out+=`<div class="workspace-grid">${items.map((t,i)=>`<div class="tile"><div><span class="badge">${t.category}</span><strong>${s.pinned.includes(t.id)?'★ ':''}${t.title}</strong></div><div class="actions"><button onclick="openToolkit('${t.id}')">Open</button><button class="ghost" onclick="moveTool('${t.id}',-1)" ${i===0?'disabled':''}>←</button><button class="ghost" onclick="moveTool('${t.id}',1)" ${i===items.length-1?'disabled':''}>→</button><button class="ghost" onclick="removeWorkspace('${t.id}')">×</button></div></div>`).join('')}</div>`}
const recent=s.recent.map(id=>DATA.toolkits.find(t=>t.id===id)).filter(Boolean);if(recent.length)out+=`<section class="card"><h3>Recently used</h3>${recent.slice(0,5).map(t=>`<div class="tool-row"><div class="grow"><strong>${t.title}</strong><div class="small">${t.category}</div></div><button class="secondary" onclick="openToolkit('${t.id}')">Open</button></div>`).join('')}</section>`;
out+=`<section class="card"><h3>Workflow collections</h3><p class="small">Create a named collection from your current Workspace layout.</p><div class="actions"><input id="collectionName" type="text" placeholder="e.g. Weekly Lending Review"><button onclick="saveCollection()">Save collection</button></div>${Object.entries(s.collections).map(([name,ids])=>`<div class="tool-row"><div class="grow"><strong>${name}</strong><div class="small">${ids.length} tools</div></div><button class="secondary" onclick="loadCollection(${JSON.stringify(name)})">Use</button></div>`).join('')}</section>`;document.getElementById('workspace').innerHTML=out;show('workspace')}
function saveCollection(){const name=document.getElementById('collectionName').value.trim();if(!name)return;const s=state();s.collections[name]=[...s.workspace];save(s);renderWorkspace()}
function loadCollection(name){const s=state();s.workspace=[...(s.collections[name]||[])];save(s);renderWorkspace()}
function showCertificates(){const s=state();let out=`<section class="card"><div class="section-label">Completion records</div><h2>Certificates</h2><p class="muted">Module and academy completion records stored on this device.</p></section>`;DATA.modules.forEach(m=>{const done=moduleComplete(m.id,s);out+=`<section class="card cert ${done?'':'locked'}"><strong>Module ${m.id} — ${m.title}</strong><p>${done?'Completed '+new Date(s.certDates[m.id]).toLocaleDateString():'Not yet completed'}</p></section>`});out+=`<section class="card cert ${academyDone(s)?'success locked':''}"><strong>AI Coach Academy</strong><p>${academyDone(s)?'Academy completed '+new Date(s.certDates.academy).toLocaleDateString():'Complete all six modules to graduate.'}</p></section>`;document.getElementById('certificates').innerHTML=out;show('certificates')}
function resetAll(){if(!confirm('Reset all AI Coach Academy progress, Workspace and certificates on this device?'))return;localStorage.removeItem(KEY);renderLearn()}
window.renderLearn=renderLearn;window.renderWorkspace=renderWorkspace;window.renderToolkits=renderToolkits;window.showCertificates=showCertificates;
renderLearn();
</script></body></html>
