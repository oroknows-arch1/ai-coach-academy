name: Reconstruct approved Academy assets

on:
  push:
    branches: [deploy-approved-academy]
    paths:
      - '.asset-staging/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-approved-academy
          fetch-depth: 0
      - name: Reconstruct and verify approved workplace images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/academy-assets
          cat .asset-staging/jxl-desktop/*.b64 | base64 --decode > /tmp/academy-assets/desktop.jxl
          cat .asset-staging/jxl-mobile/*.b64 | base64 --decode > /tmp/academy-assets/mobile.jxl
          echo "23689a2f24e0c240d62a6ae21558d178ff67bb94b62cfabc4731e974bc500bc5  /tmp/academy-assets/desktop.jxl" | sha256sum -c -
          echo "6daee8c03c786df7fed576079202f459d5c19e103db9a7ae40d85da2bf76bb1a  /tmp/academy-assets/mobile.jxl" | sha256sum -c -
          ffmpeg -hide_banner -loglevel error -y -i /tmp/academy-assets/desktop.jxl assets/workplace-desktop.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/academy-assets/mobile.jxl assets/workplace-mobile.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import hashlib
          checks = [
              ('assets/workplace-desktop.png', (706, 835), '665620172e217eba324e5251f109d7fe71c9f4797b00b92d82db7c056134fbba'),
              ('assets/workplace-mobile.png', (637, 376), '8d82eb67e6c6ae92d7eb01e9979e983949c3ffe6af76b818068c211f3efc864e'),
          ]
          for path, size, expected in checks:
              image = Image.open(path).convert('RGB')
              assert image.size == size, (path, image.size, size)
              digest = hashlib.sha256(image.tobytes()).hexdigest()
              assert digest == expected, (path, digest, expected)
              print(f'{path}: pixel-identical approved artwork verified')
          PY
          rm -f assets/workplace-desktop.jpg assets/workplace-mobile.jpg
          rm -rf .asset-staging
          rm -f .github/workflows/reconstruct-approved-assets.yml
      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oroknows-arch1"
          git config user.email "oroknows@gmail.com"
          git add -A
          git commit -m "Install verified approved Academy workplace images [skip ci]"
          git push origin HEAD:deploy-approved-academy
