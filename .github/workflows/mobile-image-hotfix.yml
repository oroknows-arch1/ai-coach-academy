name: Install clean approved mobile workplace image

on:
  push:
    branches: [main]
    paths:
      - '.asset-hotfix/READY'

permissions:
  contents: write

jobs:
  install-mobile-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify approved mobile asset
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-hotfix/mobile/*.b64 | base64 --decode > assets/workplace-mobile.webp
          echo "0674d9f365b650be922c4cf781120a0675a842be85db3e90cf5024051c68389f  assets/workplace-mobile.webp" | sha256sum -c -
          rm -rf .asset-hotfix
          rm -f .github/workflows/mobile-image-hotfix.yml

      - name: Commit verified mobile asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oroknows-arch1"
          git config user.email "oroknows@gmail.com"
          git add -A
          git commit -m "Install clean approved mobile workplace image [skip ci]"
          git push origin HEAD:main
