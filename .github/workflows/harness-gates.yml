name: Academy harness gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scorer and product regressions
        run: npm test
      - name: Static product validation
        run: npm run validate
      - name: Harness completion-state validation
        run: npm run harness
      - name: Install pinned real-model runtime
        run: npm install --no-save --ignore-scripts @huggingface/transformers@3.7.2
      - name: Adapt browser execution provider for Node evidence runner
        run: |
          sed -i "s/device: 'wasm'/device: 'cpu'/" scripts/real-model-simulation.mjs
          sed -i "s/q8\/WASM/q8\/CPU/" scripts/real-model-simulation.mjs
          sed -i "s/device:'wasm'/device:'cpu'/" scripts/real-model-simulation.mjs
      - name: Full real-model semantic simulation matrix
        run: node scripts/real-model-simulation.mjs
      - name: Preserve real-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-real-model-matrix
          path: artifacts/real-model-semantic-matrix.*
          if-no-files-found: warn
